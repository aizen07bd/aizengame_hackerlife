  <script>
    window.HLTAudio.init({ sfx:{ click:'../../assets/audio/mobile/common/sfx-click.mp3', card:'../../assets/audio/mobile/common/sfx-card.mp3' } });
    const beats=[
      { type:'narration', speaker:' ', text:'보안장비 이벤트가 가리킨 PC는 회사의 업무용 장비였다. 유나의 PC도, 해인의 PC도 아니었다. 이제 분석은 제3의 장비를 대상으로 절차에 따라 진행되어야 했다.', chars:{} },
      { type:'dialogue', speaker:'보안팀장', text:'오늘 분석 대상은 회사 소유의 업무 PC입니다. 특정 개인의 사생활 장비가 아니지만, 그래도 절차는 더 엄격하게 지켜야 합니다.', chars:{yuna:['right',1],haein:['left',1]} },
      { type:'dialogue', speaker:'강지호', text:'보안장비에서 확인한 내부 IP의 실제 단말이군요.', chars:{haein:['left',1],yuna:['right',1]} },
      { type:'dialogue', speaker:'보안팀장', text:'맞습니다. 단, 여러분이 원본 PC를 직접 만지지는 않습니다. 보안팀 포렌식 담당자가 이미징과 분석을 주도합니다.', chars:{haein:['left',1],yuna:['right',1]}, info:{title:'분석 원칙', lines:['회사 소유 업무 PC','보안팀 직원 동행','원본 직접 조작 금지','복사 이미지 기반 분석']} },
      { type:'dialogue', speaker:'한민서', text:'드디어 포렌식이네요. 수업에서 체인오브커스터디라는 말만 들었는데 실제로 보는 건 처음이에요.', chars:{minseo:['right',0],haein:['left',1]} },
      { type:'dialogue', speaker:'박준우', text:'FTK Imager로 이미징하는 과정도 볼 수 있나요? 해시값 비교하는 부분이 제일 궁금했어요.', chars:{junwoo:['right',1],minseo:['left',0]} },
      { type:'dialogue', speaker:'최태윤', text:'나도. 원본 디스크를 건드리지 않고 이미지 파일로 분석한다는 게 실제로 어떻게 돌아가는지 보고 싶었어.', chars:{taeyoon:['right',1],junwoo:['left',1]} },
      { type:'dialogue', speaker:'서해인', text:'들뜬 건 알겠는데, 지금부터는 기록 하나가 보고서 근거가 돼. 구경하듯 말하면 안 돼.', chars:{haein:['left',2],taeyoon:['right',1]} },
      { type:'dialogue', speaker:'이유나', text:'맞아요. 포렌식은 “봤다”가 아니라 “어떤 절차로 확보했는지”가 같이 남아야 해요.', chars:{yuna:['right',2],haein:['left',2]} },
      { type:'dialogue', speaker:'보안팀장', text:'먼저 체인오브커스터디를 확인합니다. 대상 장비 식별번호, 인수 시각, 담당자, 보관 위치, 분석 목적을 기록합니다.', chars:{yuna:['right',1],haein:['left',1]}, info:{title:'체인오브커스터디', lines:['장비 식별번호','인수/보관 시각','담당자 서명','분석 목적','보관 위치']} },
      { type:'dialogue', speaker:'강지호', text:'분석보다 문서가 먼저네요.', chars:{haein:['left',1],yuna:['right',1]} },
      { type:'dialogue', speaker:'보안팀장', text:'그렇습니다. 절차가 틀리면 나중에 좋은 흔적을 찾아도 증거 가치가 약해집니다.', chars:{haein:['left',1],yuna:['right',1]} },
      { type:'dialogue', speaker:'한민서', text:'원본 PC는 켜서 파일을 열어보면 안 되는 거죠?', chars:{minseo:['right',1],haein:['left',1]} },
      { type:'dialogue', speaker:'보안팀장', text:'맞습니다. 원본은 보존하고, 쓰기 차단 장비를 거쳐 이미지를 만듭니다. 분석은 복사된 이미지 파일로만 진행합니다.', chars:{minseo:['right',1],haein:['left',1]} },
      { type:'dialogue', speaker:'박준우', text:'해시값은 이미징 전후에 비교하는 거죠?', chars:{junwoo:['right',0],haein:['left',1]} },
      { type:'dialogue', speaker:'보안팀장', text:'네. 원본과 이미지의 해시가 일치해야 합니다. 이 값이 이미지가 원본과 동일하다는 최소한의 무결성 근거가 됩니다.', chars:{junwoo:['right',0],haein:['left',1]}, info:{title:'이미징 단계', lines:['쓰기 차단 연결','디스크 이미지 생성','MD5/SHA 해시 계산','원본-이미지 무결성 확인']} },
      { type:'dialogue', speaker:'최태윤', text:'그럼 지금 FTK Imager에서 보이는 건 원본 디스크가 아니라 복사본 이미지인 거네요.', chars:{taeyoon:['right',0],haein:['left',1]} },
      { type:'dialogue', speaker:'이유나', text:'네. 원본을 직접 탐색하면 접근 시간 같은 메타데이터가 바뀔 수 있어서 위험합니다.', chars:{yuna:['right',1],taeyoon:['left',0]} },
      { type:'dialogue', speaker:'서해인', text:'우리는 담당자가 보여주는 이미지 파일 안에서 필요한 흔적만 기록하자. 파일을 임의로 열거나 실행하면 안 돼.', chars:{haein:['left',4],yuna:['right',1]} },
      { type:'dialogue', speaker:'강지호', text:'먼저 지난 에피소드에서 좁힌 시간대부터 보겠습니다. 관리자 페이지 접근과 EDR 이벤트가 겹친 구간이요.', chars:{haein:['left',4],yuna:['right',1]} },
      { type:'dialogue', speaker:'보안팀장', text:'좋습니다. 파일 시스템 타임라인, 프리패치, 이벤트 로그, 브라우저 기록을 같은 시간축에 올려보겠습니다.', chars:{haein:['left',1],yuna:['right',1]} },
      { type:'dialogue', speaker:'한민서', text:'프리패치는 프로그램 실행 흔적을 보는 거였죠? 실행 파일 이름이랑 마지막 실행 시간이 남는다고 배웠어요.', chars:{minseo:['right',0],haein:['left',1]} },
      { type:'dialogue', speaker:'박준우', text:'이벤트 로그는 로그인, 서비스 실행, 오류 같은 시스템 이벤트를 맞춰보는 거고.', chars:{junwoo:['right',0],minseo:['left',0]} },
      { type:'dialogue', speaker:'최태윤', text:'브라우저 기록은 웹서버 관리자 접근 시간과 맞는지 확인하면 되겠네.', chars:{taeyoon:['right',0],junwoo:['left',0]} },
      { type:'dialogue', speaker:'서해인', text:'좋아. 다만 각각 단독으로 결론내지 말고, 같은 시간에 같은 방향을 가리키는지 봐.', chars:{haein:['left',4],taeyoon:['right',0]} },
      { type:'dialogue', speaker:'보안팀장', text:'타임라인을 열겠습니다. 21시 31분부터 21시 34분 사이를 먼저 보죠.', chars:{haein:['left',1],yuna:['right',1]}, info:{title:'확인 구간', lines:['21:31 관리자 세션 시작','21:32 게시물 변경 요청','21:33 외부 통신 반복','21:34 의심 파일 접근']} },
      { type:'dialogue', speaker:'강지호', text:'여기, 사용자 Temp 경로에 sync-helper.dat 파일이 생성된 시간이 보입니다. EDR에서 봤던 파일 생성 시간과 거의 맞아요.', chars:{haein:['left',4],yuna:['right',1]} },
      { type:'dialogue', speaker:'한민서', text:'그 직후에 rundll 비슷한 프로세스가 실행됐고, 같은 시간대에 외부 연결도 생겼어요.', chars:{minseo:['right',0],haein:['left',4]} },
      { type:'dialogue', speaker:'박준우', text:'브라우저 기록 쪽에는 corp-board 내부 관리자 페이지 접근이 남아 있어요. EP11의 내부 관리자 세션 시간이랑 겹칩니다.', chars:{junwoo:['right',0],haein:['left',1]} },
      { type:'dialogue', speaker:'최태윤', text:'DNS 캐시에도 note-sync-gateway 계열 이름이 남아 있어. EP12에서 봤던 프록시 흐름이랑 이어져요.', chars:{taeyoon:['right',0],haein:['left',1]} },
      { type:'dialogue', speaker:'이유나', text:'그럼 보안장비 이벤트와 디스크 이미지의 흔적이 같은 PC에서 이어진다는 말이 되네요.', chars:{yuna:['right',1],haein:['left',1]} },
      { type:'dialogue', speaker:'서해인', text:'아직 감염 파일의 정체는 몰라. 하지만 포렌식 대상 PC 안에서 사건 순서를 뒷받침하는 근거는 잡혔어.', chars:{haein:['left',4],yuna:['right',1]} },
      { type:'dialogue', speaker:'보안팀장', text:'다음 단계는 의심 파일을 안전하게 추출하는 것입니다. 실행하지 않고, 해시를 계산해 격리된 분석 폴더로 복사합니다.', chars:{haein:['left',1],yuna:['right',1]} },
      { type:'dialogue', speaker:'박준우', text:'샘플을 추출한다고 해서 바로 실행하는 건 아니군요.', chars:{junwoo:['right',1],haein:['left',1]} },
      { type:'dialogue', speaker:'보안팀장', text:'절대 실행하지 않습니다. 악성 여부 확인은 별도의 격리 분석 환경에서 진행합니다.', chars:{junwoo:['right',1],haein:['left',1]} },
      { type:'dialogue', speaker:'한민서', text:'이제 진짜 악성코드 분석으로 넘어가는 거네요.', chars:{minseo:['right',1],haein:['left',1]} },
      { type:'dialogue', speaker:'서해인', text:'맞아. 오늘은 “무엇을 분석해야 하는지”를 찾은 거야. 다음은 그 파일이 무엇을 하는지 밝혀야 해.', chars:{haein:['left',4],minseo:['right',1]} },
      { type:'dialogue', speaker:'강지호', text:'체인오브커스터디, 이미지 무결성, 타임라인, 의심 파일 추출까지 기록하겠습니다.', chars:{haein:['left',4],yuna:['right',1]} },
      { type:'dialogue', speaker:'이유나', text:'좋아요. 이번 기록은 보안팀 검토 후 다음 분석 환경으로 넘기겠습니다.', chars:{yuna:['right',1],haein:['left',1]} },
      { type:'narration', speaker:' ', text:'원본 PC는 봉인된 채 보관되었고, 분석은 검증된 이미지 파일 위에서만 진행되었다. 지호의 증거 카드에는 이제 의심 파일의 해시가 남았다.', chars:{}, end:true }
    ];
    const ids=['haein','junwoo','taeyoon','minseo','yuna'];
    const els=Object.fromEntries(ids.map(id=>[id,document.getElementById(id)]));
    const focusDim=document.getElementById('focusDim'), speaker=document.getElementById('speaker'), line=document.getElementById('line'), counter=document.getElementById('counter'), dialogueBox=document.getElementById('dialogueBox'), autoBtn=document.getElementById('autoBtn'), hintBtn=document.getElementById('hintBtn'), skipBtn=document.getElementById('skipBtn'), infoCard=document.getElementById('infoCard'), infoTitle=document.getElementById('infoTitle'), infoLines=document.getElementById('infoLines'), endPanel=document.getElementById('endPanel');
    let index=0, auto=false, hintOn=false, currentInfo=null, autoTimer=null, typeTimer=null, isTyping=false, currentText='';
    function stopTyping(){ if(typeTimer) clearInterval(typeTimer); typeTimer=null; isTyping=false; }
    function completeText(){ stopTyping(); line.textContent=currentText; }
    function typeText(text){ stopTyping(); currentText=text; line.textContent=''; let i=0; isTyping=true; typeTimer=setInterval(()=>{ line.textContent += text[i] || ''; i += 1; if(i > text.length) stopTyping(); }, 18); }
    function offClass(id){ return id==='haein'||id==='junwoo'?'off-left':'off-right'; }
    function applyCharacters(chars){ let shown=false; ids.forEach(id=>{ const el=els[id]; el.className='char '+id+' '+offClass(id); if(chars[id]){ const [slot,expr]=chars[id]; el.className='char '+id+' '+slot+' show expr-'+expr; shown=true; } }); focusDim.classList.toggle('on', shown); }
    function renderHint(){ infoLines.innerHTML=''; if(!hintOn || !currentInfo){ infoCard.classList.remove('show'); return; } infoTitle.textContent=currentInfo.title; currentInfo.lines.forEach(text=>{ const node=document.createElement('div'); node.className='info-line'; node.textContent=text; infoLines.appendChild(node); }); infoCard.classList.add('show'); }
    function applyInfo(info){ currentInfo=info || null; renderHint(); }
    function finish(){ endPanel.classList.add('show'); }
    function showBeat(){ const beat=beats[index]; if(!beat) return; clearTimeout(autoTimer); stopTyping(); applyCharacters(beat.chars || {}); applyInfo(beat.info); speaker.textContent=beat.speaker || ' '; counter.textContent=`${index+1} / ${beats.length}`; line.classList.toggle('muted', beat.type==='narration'); typeText(beat.text); if(beat.end) autoTimer=setTimeout(finish,1300); if(auto && !beat.end) autoTimer=setTimeout(next, Math.max(1500, beat.text.length * 85)); }
    function next(){ if(isTyping){ completeText(); return; } if(index < beats.length - 1){ index += 1; showBeat(); return; } finish(); }
    dialogueBox.addEventListener('click', next);
    document.getElementById('phone').addEventListener('click', e=>{ if(e.target.closest('button') || e.target.closest('.dialogue-box')) return; next(); });
    autoBtn.addEventListener('click',()=>{ auto=!auto; autoBtn.textContent=auto?'AUTO ON':'AUTO'; autoBtn.classList.toggle('on', auto); if(auto) showBeat(); else clearTimeout(autoTimer); });
    hintBtn.addEventListener('click',()=>{ hintOn=!hintOn; hintBtn.textContent=hintOn?'HINT ON':'HINT'; hintBtn.classList.toggle('on', hintOn); renderHint(); });
    skipBtn.addEventListener('click',()=>{ stopTyping(); index=beats.length-1; showBeat(); completeText(); });
    document.getElementById('replayButton').addEventListener('click',()=>location.reload());
    document.getElementById('nextButton').addEventListener('click',()=>window.location.href='../episode-13-investigation-menu/index.html');
    showBeat();
  </script>
</body>
