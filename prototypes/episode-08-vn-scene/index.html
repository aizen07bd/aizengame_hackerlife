    .end-kicker { color:var(--cyan); font-size:13px; font-weight:950; letter-spacing:.08em; margin-bottom:8px; } .end-title { font-size:clamp(22px,5.8vw,29px); font-weight:940; line-height:1.22; margin-bottom:10px; word-break:keep-all; } .end-copy { color:rgba(247,251,255,.72); font-size:13px; font-weight:720; line-height:1.45; margin-bottom:14px; word-break:keep-all; }

  <script>
    window.HLTAudio.init({ sfx:{ click:'../../assets/audio/mobile/common/sfx-click.mp3', card:'../../assets/audio/mobile/common/sfx-card.mp3' } });
    const beats=[
      { type:'narration', speaker:' ', text:'다음 날 밤, 동아리방 화이트보드 앞에 사람들이 하나둘 모였다.', chars:{} },
      { type:'narration', speaker:' ', text:'책상 위에는 동아리 PC 메모, 해인 선배 PC 분석지, 윤기자의 제보 요약이 섞여 있었다.', chars:{}, info:{title:'모인 자료', lines:['동아리 PC 관찰 메모','해인 PC 1차/2차 분석','외부 제보 요약']} },
      { type:'dialogue', speaker:'서해인', text:'지호야, 네가 어제 말한 비교 필요하다는 얘기부터 해 줄래?', chars:{haein:['left',1]} },
      { type:'dialogue', speaker:'강지호', text:'네. 해인 선배 PC에서 본 흐름이 동아리 PC에서 남겨 둔 흔적과 너무 닮았습니다.', chars:{haein:['left',1]} },
      { type:'dialogue', speaker:'서해인', text:'닮았다는 말은 가능하지만, 같은 사건이라는 말은 아직 조심해야 해.', chars:{haein:['left',2]} },
      { type:'dialogue', speaker:'강지호', text:'맞아요. 그래서 오늘은 결론을 내리는 게 아니라, 말할 수 있는 순서를 정하려고 합니다.', chars:{haein:['left',1]}, info:{title:'오늘 목표', lines:['새 증거 수집 아님','기존 기록 순서 정리','단정 표현 배제']} },
      { type:'dialogue', speaker:'박준우', text:'순서 정리라... 그러면 동아리 PC 얘기부터 시작하는 게 맞겠네.', chars:{junwoo:['left',1],haein:['right',1]} },
      { type:'dialogue', speaker:'박준우', text:'그때 note 계열 흔적은 있었지만, 확장 프로그램 사건의 직접 원인으로는 못 묶었잖아.', chars:{junwoo:['left',1],haein:['right',1]} },
      { type:'dialogue', speaker:'강지호', text:'네. 그래서 그때는 관찰 메모로만 남겼습니다. 직접 원인으로 말하면 과장이었으니까요.', chars:{junwoo:['left',1],haein:['right',4]} },
      { type:'dialogue', speaker:'한민서', text:'그 다음이 해인 선배 PC 1차 분석이지? CloudNote Helper가 처음 나왔던 때.', chars:{minseo:['right',1],junwoo:['left',1]} },
      { type:'dialogue', speaker:'강지호', text:'응. 그때는 검은 창, 시작 페이지 변경, Helper 실행 같은 이상 징후를 봤어.', chars:{minseo:['right',1],junwoo:['left',1]} },
      { type:'dialogue', speaker:'한민서', text:'그때도 유출이라고는 안 했지. 이상 징후와 결론은 다르다고 했고.', chars:{minseo:['right',0],junwoo:['left',1]} },
      { type:'dialogue', speaker:'최태윤', text:'근데 외부 제보에서 같은 이름이 반복됐다면, 거의 같은 쪽이라고 봐도 되는 거 아니야?', chars:{taeyoon:['right',0],minseo:['left',1]} },
      { type:'dialogue', speaker:'서해인', text:'거기서 한 번 멈춰야 해. 반복은 강한 단서지만 귀속은 아니야.', chars:{haein:['left',2],taeyoon:['right',3]} },
      { type:'dialogue', speaker:'최태윤', text:'아, 또 내가 성급했네. 반복되면 같은 공격자라고 바로 말하면 안 되는 거구나.', chars:{haein:['left',1],taeyoon:['right',4]} },
      { type:'dialogue', speaker:'강지호', text:'응. 외부 제보는 분석 방향을 잡게 해 줬고, 2차 분석에서 실제 로컬 기록으로 대조했어.', chars:{haein:['left',1],taeyoon:['right',3]}, info:{title:'근거 단계', lines:['외부 제보: 방향','로컬 기록: 대조','공격자 귀속: 보류']} },
      { type:'dialogue', speaker:'박준우', text:'그럼 해인 선배 PC 2차 분석에서 가장 중요한 건 시간대였지?', chars:{junwoo:['left',1],taeyoon:['right',3]} },
      { type:'dialogue', speaker:'강지호', text:'21시 31분부터 33분 사이요. Helper 실행, 시작 페이지 변경, 문서 폴더 접근이 그 근처에 몰렸습니다.', chars:{junwoo:['left',1],taeyoon:['right',3]} },
      { type:'dialogue', speaker:'한민서', text:'문서 폴더 접근은 무서운데, 그래도 유출 확정은 아니었지?', chars:{minseo:['right',2],junwoo:['left',1]} },
      { type:'dialogue', speaker:'강지호', text:'맞아. 문서 접근 기록은 있었지만 외부 전송 근거는 부족했어. 그래서 유출은 보류해야 해.', chars:{minseo:['right',1],junwoo:['left',1]} },
      { type:'dialogue', speaker:'최태윤', text:'그럼 화이트보드에는 확정된 말만 붙여야겠네. "유출"이나 "범인" 같은 말은 빼고.', chars:{taeyoon:['right',0],minseo:['left',0]} },
      { type:'dialogue', speaker:'서해인', text:'정확해. 이번 브리핑에서 위험한 건 부족한 근거보다, 너무 빨리 결론을 세우는 거야.', chars:{haein:['left',2],taeyoon:['right',0]} },
      { type:'dialogue', speaker:'박준우', text:'그리고 동아리 PC는 바로 초기화하면 안 돼. 원본을 보존해야 다음 비교가 가능해.', chars:{junwoo:['left',2],haein:['right',1]} },
      { type:'dialogue', speaker:'강지호', text:'네. 마지막은 동아리 PC 원본 보존과 추가 비교 계획으로 잡겠습니다.', chars:{junwoo:['left',2],haein:['right',1]} },
      { type:'dialogue', speaker:'한민서', text:'순서가 보이는 것 같아. 처음 관찰, 해인 선배 PC, 외부 제보, 2차 분석, 그리고 보류할 결론.', chars:{minseo:['right',0],haein:['left',1]}, info:{title:'흐름', lines:['관찰','이상 징후','외부 맥락','시간대 대조','보류와 계획']} },
      { type:'dialogue', speaker:'강지호', text:'그 흐름대로 포스트잇을 붙이면 돼. 중요한 건 보기 좋은 순서가 아니라 설명 가능한 순서야.', chars:{minseo:['right',0],haein:['left',4]} },
      { type:'dialogue', speaker:'최태윤', text:'내가 붙이면 또 범인부터 붙일 것 같은데.', chars:{taeyoon:['right',3],minseo:['left',3]} },
      { type:'dialogue', speaker:'한민서', text:'그러면 내가 옆에서 조용히 째려볼게.', chars:{taeyoon:['right',3],minseo:['left',0]} },
      { type:'dialogue', speaker:'박준우', text:'농담은 그만하고. 이번 정리는 동아리 전체 기록으로 남길 거야.', chars:{junwoo:['left',2],taeyoon:['right',3]} },
      { type:'dialogue', speaker:'서해인', text:'지호야, 네가 먼저 붙여 봐. 우리가 반박할 부분이 있으면 그때 말할게.', chars:{haein:['left',1],junwoo:['right',1]} },
      { type:'dialogue', speaker:'강지호', text:'좋습니다. 확정된 흐름과 보류해야 할 결론을 나눠서 정리해보겠습니다.', chars:{haein:['left',1],minseo:['right',0]} },
      { type:'narration', speaker:' ', text:'화이트보드 브리핑을 시작한다.', chars:{}, end:true }
    ];
    const ids=['haein','junwoo','taeyoon','minseo'];
    const els=Object.fromEntries(ids.map(id=>[id,document.getElementById(id)]));
    const focusDim=document.getElementById('focusDim'), speaker=document.getElementById('speaker'), line=document.getElementById('line'), counter=document.getElementById('counter'), dialogueBox=document.getElementById('dialogueBox'), autoBtn=document.getElementById('autoBtn'), hintBtn=document.getElementById('hintBtn'), skipBtn=document.getElementById('skipBtn'), infoCard=document.getElementById('infoCard'), infoTitle=document.getElementById('infoTitle'), infoLines=document.getElementById('infoLines'), endPanel=document.getElementById('endPanel');
    let index=0, auto=false, hintOn=false, currentInfo=null, autoTimer=null, typeTimer=null, isTyping=false, currentText='';
    function stopTyping(){ if(typeTimer) clearInterval(typeTimer); typeTimer=null; isTyping=false; }
    function completeText(){ stopTyping(); line.textContent=currentText; }
    function typeText(text){ stopTyping(); currentText=text; line.textContent=''; let i=0; isTyping=true; typeTimer=setInterval(()=>{ line.textContent += text[i] || ''; i += 1; if(i > text.length) stopTyping(); }, 18); }
    function offClass(id){ return id==='haein'||id==='junwoo'?'off-left':'off-right'; }
    function applyCharacters(chars){ let shown=false; ids.forEach(id=>{ const el=els[id]; el.className='char '+id+' '+offClass(id); if(chars[id]){ const [slot,expr]=chars[id]; el.className='char '+id+' '+slot+' show expr-'+expr; shown=true; } }); focusDim.classList.toggle('on', shown); }
    function renderHint(){ infoLines.innerHTML=''; if(!hintOn || !currentInfo){ infoCard.classList.remove('show'); return; } infoTitle.textContent=currentInfo.title; currentInfo.lines.forEach(text=>{ const node=document.createElement('div'); node.className='info-line'; node.textContent=text; infoLines.appendChild(node); }); infoCard.classList.add('show'); }
    function applyInfo(info){ currentInfo=info || null; renderHint(); }
    function finish(){ endPanel.classList.add('show'); }
    function showBeat(){ const beat=beats[index]; if(!beat) return; clearTimeout(autoTimer); stopTyping(); applyCharacters(beat.chars || {}); applyInfo(beat.info); speaker.textContent=beat.speaker || ' '; counter.textContent=`${index+1} / ${beats.length}`; line.classList.toggle('muted', beat.type==='narration'); typeText(beat.text); if(beat.end) autoTimer=setTimeout(finish,1300); if(auto && !beat.end) autoTimer=setTimeout(next, Math.max(1500, beat.text.length * 85)); }
    function next(){ if(isTyping){ completeText(); return; } if(index < beats.length - 1){ index += 1; showBeat(); return; } finish(); }
    dialogueBox.addEventListener('click', next);
    document.getElementById('phone').addEventListener('click', e=>{ if(e.target.closest('button') || e.target.closest('.dialogue-box')) return; next(); });
    autoBtn.addEventListener('click',()=>{ auto=!auto; autoBtn.textContent=auto?'AUTO ON':'AUTO'; autoBtn.classList.toggle('on', auto); if(auto) showBeat(); else clearTimeout(autoTimer); });
    hintBtn.addEventListener('click',()=>{ hintOn=!hintOn; hintBtn.textContent=hintOn?'HINT ON':'HINT'; hintBtn.classList.toggle('on', hintOn); renderHint(); });
    skipBtn.addEventListener('click',()=>{ stopTyping(); index=beats.length-1; showBeat(); completeText(); });
    document.getElementById('replayButton').addEventListener('click',()=>location.reload());
    document.getElementById('nextButton').addEventListener('click',()=>window.location.href='../episode-08-whiteboard-puzzle/index.html');
    showBeat();
  </script>
</body>
</html>
