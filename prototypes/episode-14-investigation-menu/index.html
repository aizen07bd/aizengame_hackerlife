: "trap"}, "ep14-x64dbg-writefile-breakpoint-01-true.png": {"source": "x64dbg", "text": "런타임에서 브라우저 설정 파일 쓰기 인자가 확인된다.", "kind": "true"}, "ep14-x64dbg-network-connect-02-true.png": {"source": "x64dbg", "text": "런타임에서 note-sync 계열 연결 인자가 확인된다.", "kind": "true"}, "ep14-x64dbg-registry-run-03-true.png": {"source": "x64dbg", "text": "런타임에서 Run 키 등록 인자가 확인된다.", "kind": "true"}, "ep14-x64dbg-runtime-init-04-trap.png": {"source": "x64dbg", "text": "일반 런타임 초기화 지점만으로 악성 행위를 설명하기 어렵다.", "kind": "trap"}, "ep14-sysinternals-procmon-file-browser-01-true.png": {"source": "Sysinternals Suite", "text": "Procmon에서 브라우저 설정 파일 변경 흐름이 관찰된다.", "kind": "true"}, "ep14-sysinternals-autoruns-runkey-02-true.png": {"source": "Sysinternals Suite", "text": "Autoruns에서 자동실행 등록이 관찰된다.", "kind": "true"}, "ep14-sysinternals-tcpview-process-03-true.png": {"source": "Sysinternals Suite", "text": "TCPView/Process Explorer에서 의심 프로세스 연결 흐름이 관찰된다.", "kind": "true"}, "ep14-sysinternals-normal-activity-04-trap.png": {"source": "Sysinternals Suite", "text": "정상 시스템 활동만으로 샘플 행위를 설명하기 어렵다.", "kind": "trap"}};
const investigationFooter=document.getElementById('investigationFooter'), evidenceDrawer=document.getElementById('evidenceDrawer'), evidenceList=document.getElementById('evidenceList'), toast=document.getElementById('toast'), toastName=document.getElementById('toastName'), toastLine=document.getElementById('toastLine');
const recordViewer=document.getElementById('recordViewer'), recordTitle=document.getElementById('recordTitle'), recordCount=document.getElementById('recordCount'), recordImage=document.getElementById('recordImage'), recordKeep=document.getElementById('recordKeep'), recordSkip=document.getElementById('recordSkip'), recordStatus=document.getElementById('recordStatus');
const zoomViewer=document.getElementById('zoomViewer'), zoomStage=document.getElementById('zoomStage'), zoomImage=document.getElementById('zoomImage'), zoomTitle=document.getElementById('zoomTitle');
let recordQueue=[], recordIndex=0, firstEvidenceMessageShown=false, toastLines=[], toastStep=0; let zoomScale=1.45, zoomX=0, zoomY=0, dragging=false, dragStartX=0, dragStartY=0, originX=0, originY=0;
const collectedEvidence=new Map();
function idFromFile(file){ return file.split('/').pop(); } function currentRecordId(){ return recordQueue[recordIndex] ? idFromFile(recordQueue[recordIndex].file) : ''; }
function saveEvidence(){ sessionStorage.setItem('ep14Evidence', JSON.stringify([...collectedEvidence.keys()])); }
function loadEvidence(){ JSON.parse(sessionStorage.getItem('ep14Evidence') || '[]').forEach(id=>{ if(evidenceMeta[id]) collectedEvidence.set(id,evidenceMeta[id]); }); if(collectedEvidence.size){ firstEvidenceMessageShown=true; investigationFooter.classList.add('show'); } renderEvidenceList(); }
function renderEvidenceList(){ evidenceList.innerHTML=''; if(!collectedEvidence.size){ const e=document.createElement('div'); e.className='evidence-empty'; e.textContent='아직 기록한 분석 화면이 없다.'; evidenceList.appendChild(e); return; } collectedEvidence.forEach(item=>{ const n=document.createElement('div'); n.className='evidence-item'; n.innerHTML=`<div class="evidence-source">${item.source}</div><div class="evidence-text">${item.text}</div>`; evidenceList.appendChild(n); }); }
function showToast(name, lines){ toastName.textContent=name; toastLines=lines; toastStep=0; toastLine.textContent=toastLines[0]; toast.classList.add('show'); }
toast.addEventListener('click',()=>{ if(toastStep<toastLines.length-1){ toastStep++; toastLine.textContent=toastLines[toastStep]; return; } toast.classList.remove('show'); });
function renderRecord(){ const current=recordQueue[recordIndex]; if(!current) return; const id=idFromFile(current.file); const collected=collectedEvidence.has(id); recordTitle.textContent=current.title; recordCount.textContent=`${recordIndex+1}/${recordQueue.length}`; recordImage.src=current.file; recordStatus.classList.toggle('show', collected); recordKeep.classList.toggle('recorded', collected); recordKeep.textContent=collected?'기록됨':'증거로 기록한다'; recordSkip.textContent=collected?'증거에서 제외한다':'관련 없어 보인다'; }
function openRecordSet(key){ recordQueue=recordSets[key] || []; recordIndex=0; renderRecord(); recordViewer.classList.add('show'); } function closeRecordSet(){ recordViewer.classList.remove('show'); recordQueue=[]; recordIndex=0; recordImage.removeAttribute('src'); } function advanceRecord(){ if(recordIndex<recordQueue.length-1){ recordIndex++; renderRecord(); return; } closeRecordSet(); }
function collectCurrentRecord(){ const id=currentRecordId(); const meta=evidenceMeta[id]; if(meta) collectedEvidence.set(id,meta); saveEvidence(); investigationFooter.classList.add('show'); renderEvidenceList(); window.HLTAudio.play('card'); if(!firstEvidenceMessageShown){ firstEvidenceMessageShown=true; showToast('강지호',['증거 카드가 생성되었다. 이번엔 도구 이름보다 화면이 실제 행위를 설명하는지 봐야 한다.']); } }
function applyZoom(){ zoomImage.style.transform=`translate(calc(-50% + ${zoomX}px), calc(-50% + ${zoomY}px)) scale(${zoomScale})`; } function resetZoom(){ zoomScale=1.45; zoomX=0; zoomY=0; applyZoom(); } function openZoom(){ if(!recordImage.src) return; zoomImage.src=recordImage.src; zoomTitle.textContent=recordTitle.textContent+' 확대'; resetZoom(); zoomViewer.classList.add('show'); } function closeZoom(){ zoomViewer.classList.remove('show'); zoomStage.classList.remove('dragging'); dragging=false; }
document.querySelectorAll('.menu-card').forEach(button=>button.addEventListener('click',()=>openRecordSet(button.dataset.target)));
recordKeep.addEventListener('click',()=>{ if(!collectedEvidence.has(currentRecordId())) collectCurrentRecord(); advanceRecord(); });
recordSkip.addEventListener('click',()=>{ const id=currentRecordId(); if(collectedEvidence.has(id)){ collectedEvidence.delete(id); saveEvidence(); renderEvidenceList(); } advanceRecord(); });
document.getElementById('recordBack').addEventListener('click',closeRecordSet); document.getElementById('evidenceOpen').addEventListener('click',()=>{ renderEvidenceList(); evidenceDrawer.classList.add('show'); }); document.getElementById('sideEvidence').addEventListener('click',()=>{ renderEvidenceList(); evidenceDrawer.classList.add('show'); }); document.getElementById('sideHint').addEventListener('click',()=>showToast('서해인',['문자열 하나보다 정적 분석, 디버깅, 행위 관찰이 같은 결론을 가리키는지 봐.'])); document.getElementById('evidenceClose').addEventListener('click',()=>evidenceDrawer.classList.remove('show'));
document.getElementById('finishInvestigation').addEventListener('click',()=>{ saveEvidence(); if(!collectedEvidence.size){ showToast('강지호',['아직 기록한 분석 화면이 없다. 도구별로 의미 있는 근거를 먼저 골라야 한다.']); return; } window.location.href='../episode-14-result/index.html'; });
recordImage.addEventListener('click',openZoom); document.getElementById('zoomClose').addEventListener('click',closeZoom); document.getElementById('zoomIn').addEventListener('click',()=>{ zoomScale=Math.min(4, zoomScale+.35); applyZoom(); }); document.getElementById('zoomOut').addEventListener('click',()=>{ zoomScale=Math.max(1, zoomScale-.35); applyZoom(); }); document.getElementById('zoomReset').addEventListener('click',resetZoom);
zoomStage.addEventListener('pointerdown',event=>{ dragging=true; zoomStage.setPointerCapture(event.pointerId); zoomStage.classList.add('dragging'); dragStartX=event.clientX; dragStartY=event.clientY; originX=zoomX; originY=zoomY; }); zoomStage.addEventListener('pointermove',event=>{ if(!dragging) return; zoomX=originX+event.clientX-dragStartX; zoomY=originY+event.clientY-dragStartY; applyZoom(); }); zoomStage.addEventListener('pointerup',()=>{ dragging=false; zoomStage.classList.remove('dragging'); }); zoomStage.addEventListener('pointercancel',()=>{ dragging=false; zoomStage.classList.remove('dragging'); }); zoomViewer.addEventListener('click',event=>{ if(event.target===zoomViewer) closeZoom(); });
loadEvidence();
