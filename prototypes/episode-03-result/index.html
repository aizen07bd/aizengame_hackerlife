<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Hacker Life: Trace - Episode 03 Result</title>
  <style>
    :root { --phone-w:min(100vw,430px); --phone-h:min(100dvh,932px); --ink:#f7fbff; --cyan:#7eeaff; --red:#ff8f9b; --green:#5fe2ad; font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif; }
    * { box-sizing:border-box; } html,body { height:100%; }
    body { margin:0; display:grid; place-items:center; overflow:hidden; color:var(--ink); background:radial-gradient(circle at 50% 8%, rgba(126,234,255,.14), transparent 34%), linear-gradient(160deg,#020409,#07131d 54%,#020409); }
    .phone { position:relative; width:var(--phone-w); height:var(--phone-h); max-height:932px; aspect-ratio:9/16; overflow:hidden; background:#05080d; box-shadow:0 28px 80px rgba(0,0,0,.62); isolation:isolate; }
    .bg { position:absolute; inset:0; background-image:linear-gradient(to bottom,rgba(0,0,0,.20),rgba(0,0,0,.72)),url("../../assets/images/mobile/backgrounds/mob-bg-club-room-night-v1.png"); background-size:cover; background-position:center; filter:saturate(.9) brightness(.68); transform:scale(1.02); }
    .topbar { position:absolute; top:calc(14px + env(safe-area-inset-top)); left:16px; right:16px; display:flex; justify-content:space-between; z-index:8; }
    .pill { padding:8px 12px; border-radius:999px; background:rgba(4,10,16,.48); border:1px solid rgba(255,255,255,.20); color:rgba(247,251,255,.80); backdrop-filter:blur(12px); font-size:12px; font-weight:850; letter-spacing:.05em; }
    .char { position:absolute; left:50%; bottom:150px; width:min(48vw,210px); aspect-ratio:312/793; background-repeat:no-repeat; background-size:contain; background-position:center bottom; filter:drop-shadow(0 28px 26px rgba(0,0,0,.52)); transform:translateX(-50%); z-index:4; }
    .haein { background-image:url("../../assets/images/characters/seo-haein/cutins/expr-2.png"); } .taeyoon { background-image:url("../../assets/images/characters/choi-taeyoon/cutins/expr-4.png"); } .junwoo { background-image:url("../../assets/images/characters/park-junwoo/cutins/expr-2.png"); }
    .minseo { aspect-ratio:330.2/793; background-image:url("../../assets/images/characters/han-minseo/expression-sheet-knee-up-transparent-v3.png"); background-size:600% 100%; background-position:20% 0%; }
    .dialogue { position:absolute; left:22px; right:22px; bottom:calc(22px + env(safe-area-inset-bottom)); min-height:136px; padding:16px; border-radius:22px; background:linear-gradient(145deg,rgba(255,255,255,.18),rgba(255,255,255,.07) 42%,rgba(7,18,27,.42)); border:1px solid rgba(255,255,255,.30); box-shadow:0 18px 36px rgba(0,0,0,.34), inset 0 1px 0 rgba(255,255,255,.16); backdrop-filter:blur(18px) saturate(1.24); z-index:9; cursor:pointer; }
    .speaker { color:var(--cyan); font-size:13px; font-weight:900; margin-bottom:10px; } .line { color:#f8fcff; font-size:clamp(17px,4.5vw,21px); font-weight:760; line-height:1.48; word-break:keep-all; } .next-mark { position:absolute; right:20px; bottom:13px; width:10px; height:10px; border-right:2px solid rgba(126,234,255,.78); border-bottom:2px solid rgba(126,234,255,.78); transform:rotate(45deg); }
    .result { position:absolute; inset:calc(68px + env(safe-area-inset-top)) 18px calc(20px + env(safe-area-inset-bottom)); z-index:12; display:none; flex-direction:column; gap:10px; min-height:0; }
    .result.show { display:flex; } .result-card { padding:15px 14px; border-radius:22px; background:linear-gradient(145deg,rgba(255,255,255,.16),rgba(255,255,255,.06)),rgba(5,10,16,.82); border:1px solid rgba(255,255,255,.24); box-shadow:0 20px 44px rgba(0,0,0,.38), inset 0 1px 0 rgba(255,255,255,.12); backdrop-filter:blur(20px) saturate(1.15); }
    .status { font-size:13px; font-weight:950; letter-spacing:.08em; margin-bottom:8px; } .status.success { color:var(--green); } .status.fail { color:var(--red); } h1 { margin:0; font-size:clamp(21px,5.6vw,28px); line-height:1.22; font-weight:930; word-break:keep-all; }
    .section-title { color:var(--cyan); font-size:13px; font-weight:900; margin:2px 0 8px; } .list { display:grid; gap:8px; } .scroll-list { overflow-y:auto; padding-right:3px; overscroll-behavior:contain; } #detailList.scroll-list { max-height:220px; }
    .item { padding:10px 11px; border-radius:14px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.14); color:rgba(247,251,255,.88); font-size:13px; font-weight:720; line-height:1.42; word-break:keep-all; }
    .actions { margin-top:auto; display:grid; grid-template-columns:1fr 1fr; gap:10px; } .action { min-height:50px; border:1px solid rgba(255,255,255,.20); border-radius:16px; background:rgba(255,255,255,.07); color:var(--ink); font-family:inherit; font-size:14px; font-weight:850; cursor:pointer; } .action.primary { border-color:rgba(126,234,255,.42); background:rgba(126,234,255,.11); }
    .stamp { position:absolute; left:50%; top:43%; z-index:40; width:min(82vw,350px); height:auto; transform:translate(-50%,-50%) rotate(-37deg) scale(2.1); opacity:0; pointer-events:none; filter:drop-shadow(0 22px 26px rgba(0,0,0,.38)); mix-blend-mode:screen; } .stamp.show { animation:stampHit 2600ms cubic-bezier(.18,.84,.26,1) forwards; }
    @keyframes stampHit { 0% { opacity:0; transform:translate(-50%,-50%) rotate(-37deg) scale(2.1); filter:blur(2px) drop-shadow(0 22px 26px rgba(0,0,0,.38)); } 13% { opacity:1; transform:translate(-50%,-50%) rotate(-37deg) scale(.92); filter:blur(0) drop-shadow(0 22px 26px rgba(0,0,0,.38)); } 19% { transform:translate(-50%,-50%) rotate(-34deg) scale(1.03); } 24% { transform:translate(-50%,-50%) rotate(-39deg) scale(.99); } 31% { transform:translate(-50%,-50%) rotate(-37deg) scale(1); } 72% { opacity:1; } 100% { opacity:0; transform:translate(-50%,-50%) rotate(-37deg) scale(1.04); } }
    .hidden { display:none; }
  </style>
</head>
<body>
  <main class="phone" aria-label="Episode 3 result"><div class="bg"></div><div class="topbar"><div class="pill">EP.03 CLUBROOM GHOST TRACE</div><div class="pill" id="modePill">분석 결과</div></div>
    <section id="rebuttalScene"><div class="char" id="rebuttalChar"></div><div class="dialogue" id="dialogueBox"><div class="speaker" id="speakerName">서해인</div><div class="line" id="rebuttalLine"></div><div class="next-mark"></div></div></section>
    <img class="stamp" id="stamp" src="../../assets/images/mobile/ui/result-stamp-failed-v1.png" alt="" aria-hidden="true" />
    <section class="result" id="resultView"><div class="result-card"><div class="status" id="statusText">RESULT</div><h1 id="headline">분석 결과</h1></div><div class="result-card"><div class="section-title" id="detailTitle">판정 근거</div><div class="list scroll-list" id="detailList"></div></div><div class="actions" id="actions"></div></section>
  </main>
  <script src="../shared-audio.js"></script>
  <script>
    const conclusion=sessionStorage.getItem('ep03Conclusion') || '';
    const isSuccess=conclusion==='extension-autostart';
    window.HLTAudio.init({ bgm:'../../assets/audio/mobile/episode-03/bgm-episode-03.mp3', bgmVolume:isSuccess?0.31:0.29, sfx:{ click:'../../assets/audio/mobile/common/sfx-click.mp3', stamp:'../../assets/audio/mobile/common/sfx-stamp.mp3' } });
    const rebuttalScene=document.getElementById('rebuttalScene'), resultView=document.getElementById('resultView'), rebuttalLine=document.getElementById('rebuttalLine'), dialogueBox=document.getElementById('dialogueBox'), speakerName=document.getElementById('speakerName'), rebuttalChar=document.getElementById('rebuttalChar'), statusText=document.getElementById('statusText'), headline=document.getElementById('headline'), detailTitle=document.getElementById('detailTitle'), detailList=document.getElementById('detailList'), actions=document.getElementById('actions'), modePill=document.getElementById('modePill'), stamp=document.getElementById('stamp');
    const rebuttalDialogues={
      'external-hack': [
        ['서해인','haein','`blackkite`가 눈에 걸리는 건 맞아. 그런데 그 흔적은 바깥에서 닿아 보였다는 기록일 뿐이야.'],
        ['서해인','haein','이번 증상은 확장 설치, 브라우저 설정 변경, 자동 실행 항목이 시간순으로 맞아. 직접 원인은 그쪽으로 잡아야 해.']
      ],
      'statement-only': [
        ['최태윤','taeyoon','내가 건드린 건 맞는데, 내 말만으로 원인이 확정되면 분석이 아니잖아.'],
        ['최태윤','taeyoon','설치 시간하고 권한, 다운로드 기록까지 맞춰야 내가 한 행동이 증상으로 이어졌다고 말할 수 있어.']
      ],
      'antivirus-safe': [
        ['박준우','junwoo','백신이 조용하다고 공용 PC가 안전한 건 아니야.'],
        ['박준우','junwoo','브라우저 확장, 시작 페이지 변경, 자동 실행은 백신 경고 없이도 운영 문제를 만들 수 있어.']
      ],
      'old-pc': [
        ['한민서','minseo','느려졌다는 말만 보면 오래된 PC처럼 보일 수 있지.'],
        ['한민서','minseo','하지만 이번엔 무엇이 새로 생겼는지가 핵심이야. 확장과 helper 기록을 먼저 봐야 해.']
      ],
      'extension-only': [
        ['박준우','junwoo','확장을 지우는 건 맞지만, 그걸로 끝내면 관리 기록이 허술해져.'],
        ['박준우','junwoo','자동 실행 항목이 남아 있으면 다시 올라올 수 있으니까 재발 근거까지 정리해야 해.']
      ]
    };
    let rebuttalIndex=0;
    function currentDialogue(){
      return rebuttalDialogues[conclusion] || [
        ['서해인','haein','결론 방향은 가까운데, 직접 원인과 별도 관찰 흔적을 더 분리해서 말해야 해.'],
        ['서해인','haein','지금 단계에서는 확장과 자동 실행은 원인, `blackkite`는 관찰 메모로 두는 게 맞아.']
      ];
    }
    function setRebuttalBeat(){
      const beat=currentDialogue()[rebuttalIndex];
      speakerName.textContent=beat[0];
      rebuttalChar.className='char '+beat[1];
      rebuttalLine.textContent=beat[2];
    }
    function failureDetails(){
      if(conclusion==='external-hack') return ['외부 재시도 흔적은 관찰 메모로 남겨야 한다.','이번 증상은 확장 프로그램, 브라우저 설정 변경, 자동 실행 항목으로 먼저 설명된다.'];
      if(conclusion==='statement-only') return ['진술은 출발점일 뿐 원인 확정 근거가 아니다.','설치 시간, 권한, 다운로드, 설정 변경 기록을 함께 봐야 한다.'];
      if(conclusion==='antivirus-safe') return ['백신 경고 없음은 안전 증명이 아니다.','브라우저 확장과 설정 변경은 백신 경고 없이도 피해를 만들 수 있다.'];
      if(conclusion==='old-pc') return ['CPU 사용률 상승은 증상일 뿐 원인이 아니다.','반복 실행되는 helper와 자동 실행 항목을 함께 봐야 한다.'];
      if(conclusion==='extension-only') return ['확장 프로그램은 핵심 원인이지만 자동 실행 항목을 빼면 재발 가능성을 설명하지 못한다.','삭제보다 먼저 기록을 남겨야 사후 설명이 가능하다.'];
      return ['직접 원인과 별도 관찰 흔적을 구분하는 표현이 부족하다.'];
    }
    function renderList(target,items){ target.innerHTML=''; items.forEach(text=>{ const div=document.createElement('div'); div.className='item'; div.textContent=text; target.appendChild(div); }); }
    function playStamp(success){ window.HLTAudio.play('stamp'); stamp.src=success?'../../assets/images/mobile/ui/result-stamp-success-v1.png':'../../assets/images/mobile/ui/result-stamp-failed-v1.png'; stamp.className='stamp'; void stamp.offsetWidth; stamp.classList.add('show'); }
    function showResult(){ rebuttalScene.classList.add('hidden'); resultView.classList.add('show'); playStamp(isSuccess); if(isSuccess){ modePill.textContent='CLEAR'; statusText.textContent='ANALYSIS SUCCESS'; statusText.className='status success'; headline.textContent='직접 원인과 별도 흔적을 분리했다.'; detailTitle.textContent='정답 근거'; renderList(detailList,['수상한 번역 확장의 설치 시간과 과도한 권한이 확인된다.','브라우저 시작 페이지와 검색 엔진 변경이 증상과 연결된다.','자동 실행 helper가 브라우저 재실행 증상을 설명한다.','다운로드 기록이 확장 유입 경로를 보강한다.','`blackkite` 재시도는 직접 원인으로 단정하지 않고 별도 관찰 메모로 남긴다.']); actions.innerHTML='<button class="action" type="button" id="backInvestigation">기록 다시 보기</button><button class="action primary" type="button" id="recapButton">사건 재구성</button>'; document.getElementById('backInvestigation').addEventListener('click',()=>window.location.href='../episode-03-investigation-menu/index.html'); document.getElementById('recapButton').addEventListener('click',()=>window.location.href='../episode-03-recap-animation/index.html'); } else { modePill.textContent='FAILED'; statusText.textContent='ANALYSIS FAILED'; statusText.className='status fail'; headline.textContent='결론을 다시 세워야 한다.'; detailTitle.textContent='반론 이후 부족한 부분'; renderList(detailList,failureDetails()); actions.innerHTML='<button class="action" type="button" id="retryFull">대화부터 다시</button><button class="action primary" type="button" id="retryInvestigation">다시 조사하기</button>'; document.getElementById('retryInvestigation').addEventListener('click',()=>window.location.href='../episode-03-investigation-menu/index.html'); document.getElementById('retryFull').addEventListener('click',()=>{ sessionStorage.removeItem('ep03Conclusion'); window.location.href='../episode-03-vn-scene/index.html'; }); } }
    if(isSuccess){ rebuttalScene.classList.add('hidden'); showResult(); } else { setRebuttalBeat(); dialogueBox.addEventListener('click',()=>{ window.HLTAudio.play('click'); rebuttalIndex+=1; if(rebuttalIndex>=currentDialogue().length){ showResult(); return; } setRebuttalBeat(); }); }
  </script>
</body>
</html>
