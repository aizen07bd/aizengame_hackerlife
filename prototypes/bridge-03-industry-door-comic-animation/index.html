<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Hacker Life: Trace - Bridge 03 Industry Door</title>
  <style>
    :root { --phone-w:min(100vw,430px); --phone-h:min(100dvh,932px); --ink:#f7fbff; --cyan:#7eeaff; --image:url("../../assets/images/mobile/bridge-03/bridge03-industry-door-prologue-comic-v1.png"); font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif; }
    * { box-sizing:border-box; } html,body { height:100%; }
    body { margin:0; display:grid; place-items:center; overflow:hidden; color:var(--ink); background:radial-gradient(circle at 50% 10%, rgba(126,234,255,.14), transparent 32%), linear-gradient(160deg,#020409,#07131d 54%,#020409); }
    .phone { position:relative; width:var(--phone-w); height:var(--phone-h); max-height:932px; aspect-ratio:9/16; overflow:hidden; background:#02050a; box-shadow:0 28px 80px rgba(0,0,0,.62); isolation:isolate; }
    .stage { position:absolute; inset:0; background:#02050a; }
    .panel,.full-page { position:absolute; inset:0; background-image:var(--image); background-size:cover; background-position:center; }
    .panel { opacity:0; transform-origin:center; filter:drop-shadow(0 20px 18px rgba(0,0,0,.62)); will-change:transform,opacity; }
    .panel-1 { clip-path:polygon(0 0,100% 0,100% 24.5%,0 30%); animation:panelFromLeft 1080ms cubic-bezier(.18,.94,.2,1) 220ms forwards; }
    .panel-2 { clip-path:polygon(0 28.8%,100% 23.2%,100% 49.8%,0 44.1%); animation:panelFromRight 1120ms cubic-bezier(.18,.94,.2,1) 1320ms forwards; }
    .panel-3 { clip-path:polygon(0 43.2%,100% 48.7%,100% 70.8%,0 76.1%); animation:panelFromLowerLeft 1160ms cubic-bezier(.18,.94,.2,1) 2440ms forwards; }
    .panel-4 { clip-path:polygon(0 74.8%,100% 69.7%,100% 100%,0 100%); animation:panelFromLowerRight 1200ms cubic-bezier(.18,.94,.2,1) 3600ms forwards; }
    .full-page { opacity:0; transform:scale(1.018); pointer-events:none; animation:revealFull 900ms ease 5200ms forwards; }
    .scanline { position:absolute; inset:0; background:repeating-linear-gradient(0deg,rgba(255,255,255,.07) 0 1px,transparent 1px 5px),linear-gradient(90deg,transparent,rgba(126,234,255,.10),transparent); opacity:.11; mix-blend-mode:screen; animation:scan 1200ms steps(2,end) infinite; pointer-events:none; }
    .flash { position:absolute; inset:0; background:#e6fbff; opacity:0; pointer-events:none; animation:finalFlash 900ms ease 7900ms forwards; }
    .controls { position:absolute; right:14px; top:calc(14px + env(safe-area-inset-top)); display:flex; gap:8px; z-index:20; }
    .control { border:1px solid rgba(255,255,255,.24); border-radius:999px; color:rgba(247,251,255,.82); background:rgba(0,0,0,.28); padding:8px 11px; font-size:12px; font-weight:850; cursor:pointer; backdrop-filter:blur(8px); }
    .caption { position:absolute; z-index:9; max-width:72%; color:#f7fbff; font-weight:900; line-height:1.18; text-shadow:0 3px 12px rgba(0,0,0,.96),0 0 14px rgba(126,234,255,.24),-2px 0 0 rgba(0,0,0,.58),2px 0 0 rgba(0,0,0,.58),0 -2px 0 rgba(0,0,0,.58),0 2px 0 rgba(0,0,0,.58); opacity:0; transform:translateY(10px); transition:opacity 320ms ease,transform 320ms ease; pointer-events:none; word-break:keep-all; }
    .caption.show { opacity:1; transform:translateY(0); }
    .cap-1 { left:7%; top:13.5%; font-size:clamp(16px,4.45vw,21px); } .cap-2 { right:7%; top:35%; max-width:62%; text-align:right; font-size:clamp(14px,3.95vw,19px); } .cap-3 { left:7%; top:60%; max-width:64%; font-size:clamp(14px,3.95vw,19px); } .cap-4 { right:7%; bottom:8.5%; max-width:70%; text-align:right; font-size:clamp(16px,4.65vw,23px); }
    .clear-panel { position:absolute; left:22px; right:22px; bottom:calc(22px + env(safe-area-inset-bottom)); z-index:24; padding:18px 16px 16px; border-radius:24px; background:linear-gradient(145deg,rgba(255,255,255,.16),rgba(255,255,255,.06)),rgba(5,10,16,.78); border:1px solid rgba(255,255,255,.24); box-shadow:0 22px 48px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.12); backdrop-filter:blur(20px) saturate(1.18); opacity:0; transform:translateY(16px); pointer-events:none; animation:showClear 520ms ease 7000ms forwards; }
    .clear-title { color:var(--cyan); font-size:13px; font-weight:950; letter-spacing:.08em; margin-bottom:8px; } .clear-line { font-size:clamp(20px,5.4vw,27px); font-weight:930; line-height:1.22; margin-bottom:14px; word-break:keep-all; }
    .clear-actions { display:grid; grid-template-columns:1fr 1fr; gap:10px; } .clear-action { min-height:46px; border:1px solid rgba(255,255,255,.20); border-radius:15px; background:rgba(255,255,255,.07); color:var(--ink); font-family:inherit; font-size:13px; font-weight:850; cursor:pointer; } .clear-action.primary { border-color:rgba(126,234,255,.42); background:rgba(126,234,255,.11); }
    @keyframes panelFromLeft { 0%{opacity:0;transform:translateX(-116%) translateY(-8%) rotate(-7deg) scale(.985)} 72%{opacity:1;transform:translateX(2.4%) rotate(.9deg) scale(1)} 100%{opacity:1;transform:translateX(0) rotate(0)} }
    @keyframes panelFromRight { 0%{opacity:0;transform:translateX(116%) translateY(-4%) rotate(7deg) scale(.985)} 72%{opacity:1;transform:translateX(-2.4%) rotate(-.9deg) scale(1)} 100%{opacity:1;transform:translateX(0) rotate(0)} }
    @keyframes panelFromLowerLeft { 0%{opacity:0;transform:translateX(-112%) translateY(34%) rotate(6deg) scale(.985)} 72%{opacity:1;transform:translateX(2.2%) translateY(-.8%) rotate(-.9deg) scale(1)} 100%{opacity:1;transform:translateX(0) translateY(0) rotate(0)} }
    @keyframes panelFromLowerRight { 0%{opacity:0;transform:translateX(112%) translateY(34%) rotate(-6deg) scale(.985)} 72%{opacity:1;transform:translateX(-2.2%) translateY(-.8%) rotate(.9deg) scale(1)} 100%{opacity:1;transform:translateX(0) translateY(0) rotate(0)} }
    @keyframes revealFull { to{opacity:1;transform:scale(1)} } @keyframes scan { to{transform:translateY(5px)} } @keyframes finalFlash { 0%,100%{opacity:0} 45%{opacity:.58} } @keyframes showClear { to{opacity:1;transform:translateY(0);pointer-events:auto} }
  </style>
</head>
<body>
  <main class="phone" aria-label="Bridge 03 industry door prologue comic animation">
    <section class="stage" id="stage">
      <div class="panel panel-1"></div><div class="panel panel-2"></div><div class="panel panel-3"></div><div class="panel panel-4"></div><div class="full-page"></div><div class="scanline"></div><div class="flash"></div>
      <div class="caption cap-1" id="cap1">학교 밖의 문이<br>처음 열렸다.</div>
      <div class="caption cap-2" id="cap2">선배는 이제<br>인턴 출입증을 달고 있었다.</div>
      <div class="caption cap-3" id="cap3">방문증 하나에도<br>규칙이 있었다.</div>
      <div class="caption cap-4" id="cap4">현업의 공기는<br>생각보다 조용했다.</div>
      <section class="clear-panel"><div class="clear-title">BRIDGE 03</div><div class="clear-line">동아리 밖의 세계로 들어간다.</div><div class="clear-actions"><button class="clear-action" id="replayStory" type="button">다시 보기</button><button class="clear-action primary" id="nextButton" type="button">대화로</button></div></section>
      <div class="controls"><button class="control" id="replay" type="button">REPLAY</button><button class="control" id="skip" type="button">SKIP</button></div>
    </section>
  </main>
  <script src="../shared-audio.js"></script>
  <script>
    window.HLTAudio.init({ sfx:{ click:'../../assets/audio/mobile/common/sfx-click.mp3', whoosh:'../../assets/audio/mobile/common/sfx-panel-whoosh.mp3', clear:'../../assets/audio/mobile/common/sfx-clear.mp3' } });
    const stage=document.getElementById('stage');
    const captions=[{at:1320,el:document.getElementById('cap1')},{at:2740,el:document.getElementById('cap2')},{at:4260,el:document.getElementById('cap3')},{at:5850,el:document.getElementById('cap4')}];
    let timers=[];
    function clearTimers(){ timers.forEach(clearTimeout); timers=[]; }
    function run(){ clearTimers(); captions.forEach(item=>item.el.classList.remove('show')); [220,1320,2440,3600].forEach(at=>timers.push(setTimeout(()=>window.HLTAudio.play('whoosh'),at))); captions.forEach(item=>timers.push(setTimeout(()=>item.el.classList.add('show'), item.at))); timers.push(setTimeout(()=>window.HLTAudio.play('clear'),7000)); }
    function skipToEnd(){ clearTimers(); for(const el of stage.querySelectorAll('.panel,.full-page,.flash,.clear-panel')){ el.style.animationDelay='0ms'; el.style.animationDuration='1ms'; } captions.forEach(item=>item.el.classList.add('show')); window.HLTAudio.play('clear'); }
    document.getElementById('replay').addEventListener('click',()=>location.reload());
    document.getElementById('skip').addEventListener('click',skipToEnd);
    document.getElementById('replayStory').addEventListener('click',()=>location.reload());
    document.getElementById('nextButton').addEventListener('click',()=>window.location.href='../bridge-03-industry-door-vn-scene/index.html');
    run();
  </script>
</body>
</html>
