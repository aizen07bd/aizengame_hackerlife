<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Hacker Life: Trace - Episode 02 Investigation</title>
  <style>
    :root { --phone-w:min(100vw,430px); --phone-h:min(100dvh,932px); --ink:#f7fbff; --cyan:#7eeaff; --green:#5fe2ad; font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif; }
    * { box-sizing:border-box; } html,body { height:100%; }
    body { margin:0; display:grid; place-items:center; overflow:hidden; color:var(--ink); background:radial-gradient(circle at 50% 8%, rgba(126,234,255,.14), transparent 34%), linear-gradient(160deg,#020409,#07131d 54%,#020409); }
    .phone { position:relative; width:var(--phone-w); height:var(--phone-h); max-height:932px; aspect-ratio:9/16; overflow:hidden; background:#05080d; box-shadow:0 28px 80px rgba(0,0,0,.62); isolation:isolate; }
    .topbar { position:absolute; top:calc(14px + env(safe-area-inset-top)); left:16px; right:16px; display:flex; align-items:center; justify-content:space-between; z-index:20; pointer-events:none; }
    .pill { padding:8px 12px; border-radius:999px; background:rgba(4,10,16,.52); border:1px solid rgba(255,255,255,.20); backdrop-filter:blur(12px); color:rgba(247,251,255,.80); font-size:12px; font-weight:850; letter-spacing:.05em; }
    .top-visual { position:absolute; top:calc(68px + env(safe-area-inset-top)); left:0; right:0; height:39%; overflow:hidden; background:#071018; }
    .top-visual::before { content:""; position:absolute; inset:0; background-image:linear-gradient(to bottom, rgba(1,6,10,.02), rgba(1,6,10,.30)), url("../../assets/images/mobile/investigation/episode-02/phishing-phone-top-v2.png"); background-size:cover; background-position:center 40%; background-repeat:no-repeat; transform:scale(1.04); }
    .top-visual::after { content:""; position:absolute; inset:0; background:repeating-linear-gradient(0deg, rgba(255,255,255,.06) 0 1px, transparent 1px 5px), linear-gradient(to bottom, transparent, rgba(0,0,0,.24)); opacity:.18; mix-blend-mode:screen; pointer-events:none; }
    .menu-panel { position:absolute; left:0; right:0; bottom:0; height:56%; padding:24px 20px calc(96px + env(safe-area-inset-bottom)); background:linear-gradient(to bottom, rgba(5,10,16,0), rgba(5,10,16,.70) 10%, rgba(4,9,14,.96) 35%, #04090e 100%); z-index:8; }
    .kicker { color:var(--cyan); font-size:13px; font-weight:900; letter-spacing:.06em; margin-bottom:8px; }
    h1 { margin:0 0 9px; max-width:330px; font-size:clamp(17px,4.7vw,21px); line-height:1.34; font-weight:820; word-break:keep-all; }
    .prompt { margin:0 0 14px; color:rgba(247,251,255,.66); font-size:13px; font-weight:640; line-height:1.45; word-break:keep-all; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:8px 10px; }
    .menu-card { min-height:54px; padding:0 13px; border:1px solid rgba(255,255,255,.20); border-radius:17px; background:linear-gradient(145deg, rgba(34,42,51,.92), rgba(18,25,32,.88)); color:var(--ink); box-shadow:0 12px 25px rgba(0,0,0,.24), inset 0 1px 0 rgba(255,255,255,.08); text-align:left; cursor:pointer; overflow:hidden; contain:paint; }
    .menu-card:active { transform:translateY(1px) scale(.99); } .menu-card:hover { border-color:rgba(126,234,255,.42); }
    .card-title { display:block; font-size:15px; font-weight:850; line-height:1.25; }
    .investigation-footer { position:absolute; left:18px; right:18px; bottom:calc(12px + env(safe-area-inset-bottom)); display:grid; grid-template-columns:1fr 1fr; gap:9px; padding:9px; border-radius:22px; background:linear-gradient(145deg, rgba(255,255,255,.10), rgba(255,255,255,.035)), rgba(2,8,13,.74); border:1px solid rgba(126,234,255,.18); box-shadow:0 18px 40px rgba(0,0,0,.34), inset 0 1px 0 rgba(255,255,255,.10); backdrop-filter:blur(18px) saturate(1.15); opacity:0; transform:translateY(12px); pointer-events:none; transition:opacity 220ms ease, transform 220ms ease; z-index:12; }
    .investigation-footer.show { opacity:1; transform:translateY(0); pointer-events:auto; }
    .footer-action { min-height:42px; border:1px solid rgba(255,255,255,.18); border-radius:15px; background:rgba(255,255,255,.055); color:rgba(247,251,255,.88); font-family:inherit; font-size:13px; font-weight:850; cursor:pointer; }
    .footer-action.primary { border-color:rgba(126,234,255,.42); background:rgba(126,234,255,.10); color:#e9fbff; }
    .record-viewer { position:absolute; inset:0; z-index:18; background:radial-gradient(circle at 50% 7%, rgba(126,234,255,.10), transparent 34%), linear-gradient(180deg,#071019,#03070c 74%); opacity:0; pointer-events:none; transform:translateY(18px); transition:opacity 220ms ease, transform 260ms ease; }
    .record-viewer.show { opacity:1; pointer-events:auto; transform:translateY(0); }
    .record-header { position:absolute; top:calc(58px + env(safe-area-inset-top)); left:18px; right:18px; height:42px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .back-button,.judge-button,.side-tool { border:1px solid rgba(255,255,255,.22); background:rgba(255,255,255,.08); color:var(--ink); border-radius:999px; backdrop-filter:blur(14px); font-family:inherit; font-weight:820; cursor:pointer; }
    .back-button { width:42px; height:36px; font-size:18px; }
    .record-title { flex:1; min-width:0; font-size:14px; font-weight:900; color:rgba(247,251,255,.86); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-align:center; }
    .record-count { min-width:42px; text-align:right; color:rgba(247,251,255,.58); font-size:12px; font-weight:800; }
    .record-status { position:absolute; right:18px; top:calc(104px + env(safe-area-inset-top)); z-index:30; display:inline-flex; align-items:center; gap:6px; min-height:28px; padding:0 10px; border-radius:999px; background:rgba(33,156,111,.20); border:1px solid rgba(95,226,173,.44); color:rgba(214,255,238,.96); box-shadow:0 10px 22px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.12); backdrop-filter:blur(12px); font-size:12px; font-weight:900; opacity:0; transform:translateY(-4px); pointer-events:none; transition:opacity 160ms ease, transform 160ms ease; }
    .record-status.show { opacity:1; transform:translateY(0); }
    .side-tools { position:absolute; right:12px; top:calc(154px + env(safe-area-inset-top)); z-index:31; display:grid; gap:8px; }
    .side-tool { width:48px; height:44px; border-radius:15px; font-size:12px; background:linear-gradient(145deg, rgba(255,255,255,.14), rgba(255,255,255,.055)); box-shadow:0 12px 26px rgba(0,0,0,.28); }
    .record-image-wrap { position:absolute; left:18px; right:18px; top:calc(112px + env(safe-area-inset-top)); bottom:calc(142px + env(safe-area-inset-bottom)); display:grid; place-items:center; }
    .record-image { width:min(100%,390px); max-height:100%; object-fit:contain; border-radius:24px; box-shadow:0 24px 58px rgba(0,0,0,.46); background:#111923; }
    .record-actions { position:absolute; left:18px; right:18px; bottom:calc(22px + env(safe-area-inset-bottom)); display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .judge-button { min-height:52px; border-radius:17px; font-size:15px; background:linear-gradient(145deg, rgba(255,255,255,.13), rgba(255,255,255,.055)); box-shadow:0 12px 25px rgba(0,0,0,.24), inset 0 1px 0 rgba(255,255,255,.10); }
    .judge-button.primary { border-color:rgba(126,234,255,.34); } .judge-button.recorded { border-color:rgba(95,226,173,.46); color:rgba(214,255,238,.96); background:linear-gradient(145deg, rgba(95,226,173,.18), rgba(255,255,255,.055)); }
    .evidence-drawer { position:absolute; inset:auto 18px calc(82px + env(safe-area-inset-bottom)); max-height:54%; z-index:34; padding:17px 15px 15px; border-radius:22px; background:linear-gradient(145deg, rgba(255,255,255,.16), rgba(255,255,255,.06)), rgba(5,10,16,.86); border:1px solid rgba(255,255,255,.24); box-shadow:0 22px 48px rgba(0,0,0,.42); backdrop-filter:blur(20px) saturate(1.2); opacity:0; transform:translateY(16px); pointer-events:none; transition:opacity 220ms ease, transform 220ms ease; }
    .evidence-drawer.show { opacity:1; transform:translateY(0); pointer-events:auto; }
    .drawer-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px; }
    .drawer-title { color:var(--cyan); font-size:14px; font-weight:900; } .drawer-close { width:34px; height:30px; border:1px solid rgba(255,255,255,.20); border-radius:999px; background:rgba(255,255,255,.08); color:var(--ink); font-size:16px; font-weight:900; cursor:pointer; }
    .evidence-list { display:grid; gap:9px; max-height:320px; overflow:auto; padding-right:2px; }
    .evidence-item { padding:11px 12px; border-radius:14px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.15); } .evidence-source { color:rgba(247,251,255,.58); font-size:11px; font-weight:800; margin-bottom:5px; } .evidence-text { color:rgba(247,251,255,.90); font-size:13px; font-weight:760; line-height:1.42; word-break:keep-all; } .evidence-empty { color:rgba(247,251,255,.58); font-size:13px; font-weight:680; line-height:1.45; }
    .toast { position:absolute; left:18px; right:18px; bottom:calc(18px + env(safe-area-inset-bottom)); z-index:40; min-height:118px; padding:16px 16px 15px; border-radius:20px; background:rgba(4,10,16,.76); border:1px solid rgba(255,255,255,.24); box-shadow:0 20px 42px rgba(0,0,0,.38), inset 0 1px 0 rgba(255,255,255,.14); backdrop-filter:blur(18px) saturate(1.2); opacity:0; transform:translateY(18px); pointer-events:none; transition:opacity 240ms ease, transform 240ms ease; }
    .toast.show { opacity:1; transform:translateY(0); pointer-events:auto; } .toast-name { color:var(--cyan); font-size:13px; font-weight:900; margin-bottom:8px; } .toast-line { min-height:54px; font-size:clamp(16px,4.35vw,20px); font-weight:740; line-height:1.46; word-break:keep-all; } .toast-next { position:absolute; right:18px; bottom:13px; width:10px; height:10px; border-right:2px solid rgba(126,234,255,.78); border-bottom:2px solid rgba(126,234,255,.78); transform:rotate(45deg); }
  </style>
</head>
<body>
  <main class="phone" aria-label="Episode 2 phishing investigation">
    <div class="top-visual"></div>
    <div class="topbar"><div class="pill">EP.02 THE LINK AT HOME</div><div class="pill">조사 모드</div></div>
    <section class="menu-panel">
      <div class="kicker">피싱 피해 범위 확인</div><h1>어디부터 확인해볼까?</h1><p class="prompt">부모님이 허락한 범위 안에서 접속, 입력, 설치, 결제 흔적만 확인하자.</p>
      <div class="grid">
        <button class="menu-card" type="button" data-target="message"><span class="card-title">문자 원문 확인</span></button>
        <button class="menu-card" type="button" data-target="link"><span class="card-title">링크 주소 확인</span></button>
        <button class="menu-card" type="button" data-target="browser"><span class="card-title">브라우저 방문 기록</span></button>
        <button class="menu-card" type="button" data-target="card"><span class="card-title">카드 결제 알림</span></button>
        <button class="menu-card" type="button" data-target="app"><span class="card-title">앱 설치 기록</span></button>
        <button class="menu-card" type="button" data-target="sensitive"><span class="card-title">연락처/사진 접근 기록</span></button>
      </div>
    </section>
    <div class="investigation-footer" id="investigationFooter"><button class="footer-action" type="button" id="evidenceOpen">증거 카드 보기</button><button class="footer-action primary" type="button" id="finishInvestigation">조사 완료</button></div>
    <section class="evidence-drawer" id="evidenceDrawer"><div class="drawer-head"><div class="drawer-title">증거 카드</div><button class="drawer-close" type="button" id="evidenceClose">×</button></div><div class="evidence-list" id="evidenceList"></div></section>
    <section class="record-viewer" id="recordViewer"><div class="record-header"><button class="back-button" type="button" id="recordBack">‹</button><div class="record-title" id="recordTitle">기록 조회</div><div class="record-count" id="recordCount">1/1</div></div><div class="record-status" id="recordStatus">기록됨</div><div class="side-tools"><button class="side-tool" type="button" id="sideEvidence">카드</button><button class="side-tool" type="button" id="sideHint">힌트</button></div><div class="record-image-wrap"><img class="record-image" id="recordImage" alt="피싱 조사 증거 화면" /></div><div class="record-actions"><button class="judge-button primary" type="button" id="recordKeep">증거로 기록한다</button><button class="judge-button" type="button" id="recordSkip">관련 없어 보인다</button></div></section>
    <div class="toast" id="toast"><div class="toast-name" id="toastName">강지호</div><div class="toast-line" id="toastLine"></div><div class="toast-next"></div></div>
  </main>
  <script src="../shared-audio.js"></script>
  <script>
    window.HLTAudio.init({ bgm:'../../assets/audio/mobile/episode-02/bgm-episode-02.mp3', bgmVolume:0.29, sfx:{ click:'../../assets/audio/mobile/common/sfx-click.mp3', card:'../../assets/audio/mobile/common/sfx-card.mp3' } });
    const base='../../assets/images/mobile/investigation/episode-02/photo-generated-cropped/';
    const recordSets={
      message:[{title:'문자 원문 확인',file:base+'ep02-message-original-01-true.png'},{title:'문자 원문 확인',file:base+'ep02-message-original-02-trap.png'}],
      link:[{title:'링크 주소 확인',file:base+'ep02-link-url-01-true.png'},{title:'링크 주소 확인',file:base+'ep02-link-url-02-trap.png'}],
      browser:[{title:'브라우저 방문 기록',file:base+'ep02-browser-history-01-true.png'},{title:'브라우저 방문 기록',file:base+'ep02-browser-history-02-trap.png'}],
      card:[{title:'카드 결제 알림',file:base+'ep02-card-alert-01-true.png'},{title:'카드 결제 알림',file:base+'ep02-card-alert-02-trap.png'}],
      app:[{title:'앱 설치 기록',file:base+'ep02-app-install-01-true.png'},{title:'앱 설치 기록',file:base+'ep02-app-install-02-trap.png'}],
      sensitive:[{title:'연락처/사진 접근 기록',file:base+'ep02-photo-access-01-sensitive.png'},{title:'연락처/사진 접근 기록',file:base+'ep02-contact-access-02-sensitive.png'}]
    };
    const evidenceMeta={
      'ep02-message-original-01-true.png':{source:'문자 원문',text:'배송 주소 확인을 요구하는 사칭 문자와 외부 링크가 확인된다.'},
      'ep02-message-original-02-trap.png':{source:'문자 원문',text:'오래된 정상 배송/광고 문자로 이번 사건과 직접 연결되지 않는다.'},
      'ep02-link-url-01-true.png':{source:'링크 주소',text:'문자에서 열린 외부 배송 확인 도메인이 확인된다.'},
      'ep02-link-url-02-trap.png':{source:'링크 주소',text:'검색 결과 주소로 피싱 문자 링크의 근거가 아니다.'},
      'ep02-browser-history-01-true.png':{source:'브라우저 기록',text:'문자 링크와 카드 입력 페이지까지 열린 흔적이 있지만 완료 기록은 없다.'},
      'ep02-browser-history-02-trap.png':{source:'브라우저 기록',text:'평소 웹 사용 기록으로 피싱 흐름을 설명하지 못한다.'},
      'ep02-card-alert-01-true.png':{source:'카드 알림',text:'피싱 링크 접속 시간대에 새 결제 승인 알림이 없다.'},
      'ep02-card-alert-02-trap.png':{source:'카드 알림',text:'오래된 정상/거절 알림으로 이번 사건 시간대 피해 근거가 아니다.'},
      'ep02-app-install-01-true.png':{source:'앱 설치 기록',text:'링크 이후 새 앱 설치, APK 다운로드, 새 권한 허용이 보이지 않는다.'},
      'ep02-app-install-02-trap.png':{source:'앱 설치 기록',text:'이전부터 있던 앱/업데이트 기록으로 이번 링크 직후 설치가 아니다.'},
      'ep02-photo-access-01-sensitive.png':{source:'사진 접근 기록',text:'조사 범위를 벗어난 개인 사진 접근 기록이다.'},
      'ep02-contact-access-02-sensitive.png':{source:'연락처 접근 기록',text:'조사 범위를 벗어난 개인 연락처 접근 기록이다.'}
    };
    const investigationFooter=document.getElementById('investigationFooter'), evidenceDrawer=document.getElementById('evidenceDrawer'), evidenceList=document.getElementById('evidenceList'), toast=document.getElementById('toast'), toastName=document.getElementById('toastName'), toastLine=document.getElementById('toastLine');
    const recordViewer=document.getElementById('recordViewer'), recordTitle=document.getElementById('recordTitle'), recordCount=document.getElementById('recordCount'), recordImage=document.getElementById('recordImage'), recordKeep=document.getElementById('recordKeep'), recordSkip=document.getElementById('recordSkip'), recordStatus=document.getElementById('recordStatus');
    let recordQueue=[], recordIndex=0, firstEvidenceMessageShown=false, sensitiveWarned=false, toastLines=[], toastStep=0;
    const collectedEvidence=new Map();
    function idFromFile(file){ return file.split('/').pop(); }
    function currentRecordId(){ return recordQueue[recordIndex] ? idFromFile(recordQueue[recordIndex].file) : ''; }
    function saveEvidence(){ sessionStorage.setItem('ep02Evidence', JSON.stringify([...collectedEvidence.keys()])); }
    function loadEvidence(){ JSON.parse(sessionStorage.getItem('ep02Evidence') || '[]').forEach(id=>{ if(evidenceMeta[id]) collectedEvidence.set(id,evidenceMeta[id]); }); if(collectedEvidence.size){ firstEvidenceMessageShown=true; investigationFooter.classList.add('show'); } renderEvidenceList(); }
    function renderEvidenceList(){ evidenceList.innerHTML=''; if(!collectedEvidence.size){ const e=document.createElement('div'); e.className='evidence-empty'; e.textContent='아직 기록한 증거가 없다.'; evidenceList.appendChild(e); return; } collectedEvidence.forEach(item=>{ const n=document.createElement('div'); n.className='evidence-item'; n.innerHTML=`<div class="evidence-source">${item.source}</div><div class="evidence-text">${item.text}</div>`; evidenceList.appendChild(n); }); }
    function showToast(name, lines){ toastName.textContent=name; toastLines=lines; toastStep=0; toastLine.textContent=toastLines[0]; toast.classList.add('show'); }
    toast.addEventListener('click',()=>{ if(toastStep<toastLines.length-1){ toastStep++; toastLine.textContent=toastLines[toastStep]; return; } toast.classList.remove('show'); });
    function renderRecord(){ const current=recordQueue[recordIndex]; if(!current) return; const id=idFromFile(current.file); const collected=collectedEvidence.has(id); recordTitle.textContent=current.title; recordCount.textContent=`${recordIndex+1}/${recordQueue.length}`; recordImage.src=current.file; recordStatus.classList.toggle('show', collected); recordKeep.classList.toggle('recorded', collected); recordKeep.textContent=collected?'기록됨':'증거로 기록한다'; recordSkip.textContent=collected?'증거에서 제외한다':'관련 없어 보인다'; }
    function openRecordSet(key){ if(key==='sensitive' && !sensitiveWarned){ sensitiveWarned=true; showToast('어머니',['잠깐, 사진이나 연락처는 이번 사건과 직접 관련 있을 때만 봐줘.']); } recordQueue=recordSets[key] || []; recordIndex=0; renderRecord(); recordViewer.classList.add('show'); }
    function closeRecordSet(){ recordViewer.classList.remove('show'); recordQueue=[]; recordIndex=0; recordImage.removeAttribute('src'); }
    function advanceRecord(){ if(recordIndex<recordQueue.length-1){ recordIndex++; renderRecord(); return; } closeRecordSet(); }
    function collectCurrentRecord(){ const id=currentRecordId(); const meta=evidenceMeta[id]; if(meta) collectedEvidence.set(id,meta); saveEvidence(); investigationFooter.classList.add('show'); renderEvidenceList(); window.HLTAudio.play('card'); if(!firstEvidenceMessageShown){ firstEvidenceMessageShown=true; showToast('강지호',['증거 카드가 생성되었다. 수집한 기록을 다시 확인할 수 있다.']); } }
    document.querySelectorAll('.menu-card').forEach(button=>button.addEventListener('click',()=>openRecordSet(button.dataset.target)));
    recordKeep.addEventListener('click',()=>{ if(!collectedEvidence.has(currentRecordId())) collectCurrentRecord(); advanceRecord(); });
    recordSkip.addEventListener('click',()=>{ const id=currentRecordId(); if(collectedEvidence.has(id)){ collectedEvidence.delete(id); saveEvidence(); renderEvidenceList(); } advanceRecord(); });
    document.getElementById('recordBack').addEventListener('click',closeRecordSet);
    document.getElementById('evidenceOpen').addEventListener('click',()=>{ renderEvidenceList(); evidenceDrawer.classList.add('show'); });
    document.getElementById('sideEvidence').addEventListener('click',()=>{ renderEvidenceList(); evidenceDrawer.classList.add('show'); });
    document.getElementById('sideHint').addEventListener('click',()=>showToast('강지호',['힌트는 아직 쓰지 말자. 부모님이 말한 범위 안에서만 기록을 비교해보면 된다.']));
    document.getElementById('evidenceClose').addEventListener('click',()=>evidenceDrawer.classList.remove('show'));
    document.getElementById('finishInvestigation').addEventListener('click',()=>{ saveEvidence(); if(!collectedEvidence.size){ showToast('강지호',['아직 기록한 증거가 없다. 피해 범위를 설명하려면 근거가 필요하다.']); return; } window.location.href='../episode-02-conclusion/index.html'; });
    loadEvidence();
  </script>
</body>
</html>
