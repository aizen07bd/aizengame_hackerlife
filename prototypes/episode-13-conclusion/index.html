<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Hacker Life: Trace - Episode 13 Conclusion</title>
  <style>
    :root { --phone-w:min(100vw,430px); --phone-h:min(100dvh,932px); --ink:#f7fbff; --cyan:#7eeaff; --red:#ff8f9b; font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif; }
    * { box-sizing:border-box; } html,body { height:100%; }
    body { margin:0; display:grid; place-items:center; overflow:hidden; color:var(--ink); background:radial-gradient(circle at 50% 8%, rgba(126,234,255,.14), transparent 34%), linear-gradient(160deg,#020409,#07131d 54%,#020409); }
    .phone { position:relative; width:var(--phone-w); height:var(--phone-h); max-height:932px; aspect-ratio:9/16; overflow:hidden; background:#05080d; box-shadow:0 28px 80px rgba(0,0,0,.62); isolation:isolate; }
    .bg { position:absolute; inset:0; background-image:linear-gradient(to bottom,rgba(0,0,0,.20),rgba(0,0,0,.80)),url("../../assets/images/mobile/backgrounds/mob-bg-forensic-lab-v1.png"); background-size:cover; background-position:center; filter:saturate(.9) brightness(.66); transform:scale(1.03); }
    .topbar { position:absolute; top:calc(14px + env(safe-area-inset-top)); left:16px; right:16px; display:flex; justify-content:space-between; z-index:5; gap:10px; }
    .pill { padding:8px 12px; border-radius:999px; background:rgba(4,10,16,.48); border:1px solid rgba(255,255,255,.20); color:rgba(247,251,255,.82); backdrop-filter:blur(12px); font-size:12px; font-weight:850; letter-spacing:.05em; white-space:nowrap; }
    .content { position:absolute; inset:calc(68px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom)); z-index:3; display:flex; flex-direction:column; gap:9px; min-height:0; overflow:hidden; }
    .kicker { color:var(--cyan); font-size:13px; font-weight:900; letter-spacing:.06em; margin-bottom:7px; }
    h1 { margin:0; font-size:clamp(18px,5vw,24px); line-height:1.22; font-weight:930; word-break:keep-all; }
    .card { border-radius:22px; background:linear-gradient(145deg,rgba(255,255,255,.15),rgba(255,255,255,.055)),rgba(5,10,16,.78); border:1px solid rgba(255,255,255,.23); box-shadow:0 18px 38px rgba(0,0,0,.34), inset 0 1px 0 rgba(255,255,255,.12); backdrop-filter:blur(18px) saturate(1.15); }
    .summary { flex:0 0 auto; padding:12px; max-height:188px; overflow:hidden; }
    .summary-title { color:var(--cyan); font-size:12px; font-weight:900; margin-bottom:7px; }
    .evidence-list { display:grid; gap:7px; max-height:128px; overflow-y:auto; padding-right:3px; overscroll-behavior:contain; }
    .evidence { padding:8px 10px; border-radius:13px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.14); }
    .source { color:rgba(247,251,255,.56); font-size:10px; font-weight:850; margin-bottom:4px; }
    .evidence-text { color:rgba(247,251,255,.88); font-size:11px; font-weight:720; line-height:1.36; word-break:keep-all; }
    .empty { color:rgba(247,251,255,.70); font-size:13px; font-weight:720; line-height:1.45; word-break:keep-all; }
    .choices { flex:1 1 auto; display:grid; gap:8px; align-content:start; min-height:0; overflow-y:auto; padding:2px 2px 8px 0; overscroll-behavior:contain; }
    .choice { min-height:48px; padding:0 13px; border:1px solid rgba(255,255,255,.20); border-radius:16px; background:linear-gradient(145deg,rgba(34,42,51,.92),rgba(18,25,32,.88)); color:var(--ink); text-align:left; box-shadow:0 12px 25px rgba(0,0,0,.24), inset 0 1px 0 rgba(255,255,255,.08); font-family:inherit; font-size:13px; font-weight:850; line-height:1.33; word-break:keep-all; cursor:pointer; }
    .choice:active,.back:active { transform:translateY(1px) scale(.99); } .choice[disabled] { opacity:.46; cursor:not-allowed; }
    .back { min-height:44px; border:1px solid rgba(255,255,255,.18); border-radius:15px; background:rgba(255,255,255,.06); color:rgba(247,251,255,.78); font-family:inherit; font-size:13px; font-weight:820; cursor:pointer; }
    .warning { color:var(--red); font-size:12px; font-weight:850; line-height:1.4; padding:10px 12px; border-radius:14px; background:rgba(255,143,155,.10); border:1px solid rgba(255,143,155,.24); }
  </style>
</head>
<body>
  <main class="phone"><div class="bg"></div><div class="topbar"><div class="pill">EP.13 FORENSIC IMAGE</div><div class="pill">결론 제출</div></div>
    <section class="content"><div><div class="kicker">증거 카드 요약</div><h1>이 포렌식 자료들로 어디까지 말할 수 있을까?</h1></div><section class="card summary"><div class="summary-title">수집한 분석 자료</div><div class="evidence-list" id="evidenceList"></div></section><div class="warning" id="emptyWarning" hidden>기록한 분석 자료가 없다. 먼저 조사 화면에서 무결성, 타임라인, 실행 흔적, 샘플 추출 절차를 수집해야 한다.</div><div class="choices">
      <button class="choice" type="button" data-conclusion="malware-sample-ready">무결성이 확인된 이미지에서 의심 파일 실행 흔적과 안전한 추출까지 이어진다.</button>
      <button class="choice" type="button" data-conclusion="hash-skip">파일명이 수상하니 해시 검증 없이도 샘플로 확정한다.</button>
      <button class="choice" type="button" data-conclusion="cache-infection">일반 캐시 파일이 많으니 감염 흔적으로 본다.</button>
      <button class="choice" type="button" data-conclusion="normal-prefetch">정상 프로그램 Prefetch가 있으니 사건과 무관하다고 본다.</button>
      <button class="choice" type="button" data-conclusion="direct-run">의심 파일을 직접 실행해 동작을 먼저 확인해야 한다.</button>
      <button class="choice" type="button" data-conclusion="malware-family-final">추출 파일이 있으니 악성코드 종류와 공격자를 확정한다.</button>
      <button class="back" type="button" id="backButton">다시 조사하기</button>
    </div></section>
  </main>
  <script src="../shared-audio.js"></script>
  <script>
    window.HLTAudio.init({ sfx:{ click:'../../assets/audio/mobile/common/sfx-click.mp3' } });
    const evidenceMeta={
      'ep13-imaging-hash-match-01-true.png':{source:'이미징/무결성',text:'원본 디스크 이미지와 검증 해시가 일치해 복사 이미지의 무결성이 확인된다.'},
      'ep13-timeline-suspicious-files-01-true.png':{source:'파일 타임라인',text:'21:31-21:33 사건 시간대에 sync-helper.dat와 note_cache.dll 생성/변경이 집중되어 있다.'},
      'ep13-artifact-prefetch-amcache-01-true.png':{source:'실행 아티팩트',text:'Prefetch/Amcache에서 의심 파일 실행 흔적이 사건 시간대와 맞물린다.'},
      'ep13-sample-export-hash-01-true.png':{source:'샘플 추출',text:'의심 파일을 격리 폴더로 추출하고 SHA256을 계산해 다음 분석 대상으로 넘길 수 있다.'},
      'ep13-imaging-no-verify-02-trap.png':{source:'이미징/무결성',text:'해시 검증이 비어 있거나 절차가 누락되어 포렌식 이미지의 무결성 근거로 부족하다.'},
      'ep13-timeline-normal-cache-02-trap.png':{source:'파일 타임라인',text:'일반 캐시 파일과 사건 시간대 밖의 기록이라 의심 파일 흐름을 설명하지 못한다.'},
      'ep13-artifact-normal-prefetch-02-trap.png':{source:'실행 아티팩트',text:'정상 프로그램 실행 흔적만 보여 사건 파일 실행 근거로 보기 어렵다.'},
      'ep13-sample-direct-run-02-trap.png':{source:'샘플 추출',text:'의심 파일을 직접 실행하려는 절차는 분석 환경을 오염시킬 수 있어 증거로 채택하면 안 된다.'}
    };
    const evidenceList=document.getElementById('evidenceList'), warning=document.getElementById('emptyWarning');
    const collected=JSON.parse(sessionStorage.getItem('ep13Evidence') || '[]').filter(id=>evidenceMeta[id]);
    function renderEvidence(){ evidenceList.innerHTML=''; if(!collected.length){ const empty=document.createElement('div'); empty.className='empty'; empty.textContent='아직 수집한 자료가 없다.'; evidenceList.appendChild(empty); warning.hidden=false; document.querySelectorAll('.choice').forEach(button=>button.disabled=true); return; } collected.forEach(id=>{ const item=evidenceMeta[id]; const div=document.createElement('div'); div.className='evidence'; div.innerHTML=`<div class="source">${item.source}</div><div class="evidence-text">${item.text}</div>`; evidenceList.appendChild(div); }); }
    document.querySelectorAll('.choice').forEach(button=>button.addEventListener('click',()=>{ if(button.disabled) return; sessionStorage.setItem('ep13Conclusion', button.dataset.conclusion); window.location.href='../episode-13-result/index.html'; }));
    document.getElementById('backButton').addEventListener('click',()=>{ window.location.href='../episode-13-investigation-menu/index.html'; });
    renderEvidence();
  </script>
</body>
</html>
