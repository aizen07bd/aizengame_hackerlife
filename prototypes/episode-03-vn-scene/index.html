<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Hacker Life: Trace - Episode 03 VN Scene</title>
  <style>
    :root { --phone-w:min(100vw,430px); --phone-h:min(100dvh,932px); --ink:#f7fbff; --cyan:#81ecff; font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif; }
    * { box-sizing:border-box; } html,body { height:100%; }
    body { margin:0; display:grid; place-items:center; overflow:hidden; color:var(--ink); background:radial-gradient(circle at 50% 8%, rgba(129,236,255,.12), transparent 34%), linear-gradient(160deg,#020409,#07131d 54%,#020409); }
    .phone { position:relative; width:var(--phone-w); height:var(--phone-h); max-height:932px; aspect-ratio:9/16; overflow:hidden; background:#05080d; box-shadow:0 28px 80px rgba(0,0,0,.62); user-select:none; isolation:isolate; }
    .bg { position:absolute; inset:0; background-image:linear-gradient(to bottom, rgba(0,0,0,.08), rgba(0,0,0,.24) 44%, rgba(0,0,0,.68)), url("../../assets/images/mobile/backgrounds/mob-bg-club-room-night-v1.png"); background-size:cover; background-position:center; transform:scale(1.02); }
    .scene-vignette { position:absolute; inset:0; background:radial-gradient(circle at 50% 45%, transparent 0 30%, rgba(0,0,0,.24) 62%, rgba(0,0,0,.58) 100%), linear-gradient(to bottom, rgba(2,6,10,.12), transparent 26%, rgba(2,6,10,.42)); pointer-events:none; }
    .topbar { position:absolute; top:calc(14px + env(safe-area-inset-top)); left:16px; right:16px; display:flex; justify-content:space-between; align-items:center; gap:12px; z-index:12; opacity:.94; }
    .chapter,.ghost-button { border:1px solid rgba(255,255,255,.20); border-radius:999px; background:rgba(4,10,16,.38); color:rgba(247,251,255,.78); backdrop-filter:blur(10px); font-weight:850; }
    .chapter { padding:8px 12px; font-size:12px; letter-spacing:.06em; } .small-actions { display:flex; gap:8px; } .ghost-button { padding:8px 11px; font-size:11px; cursor:pointer; }
    .focus-dim { position:absolute; inset:0; background:rgba(0,0,0,.16); opacity:0; transition:opacity 260ms ease; pointer-events:none; z-index:3; } .focus-dim.on { opacity:1; }
    .char { position:absolute; bottom:148px; width:min(43vw,188px); aspect-ratio:312/793; background-repeat:no-repeat; background-size:contain; background-position:center bottom; opacity:0; filter:drop-shadow(0 28px 24px rgba(0,0,0,.50)); transition:opacity 320ms ease, transform 420ms cubic-bezier(.18,.84,.26,1), background-image 140ms step-end; z-index:5; pointer-events:none; }
    .char.left { left:27%; transform:translateX(-50%) translateY(16px) scale(.985); } .char.right { left:73%; transform:translateX(-50%) translateY(16px) scale(.985); } .char.center { left:50%; transform:translateX(-50%) translateY(16px) scale(.985); }
    .char.show.left,.char.show.right,.char.show.center { opacity:1; transform:translateX(-50%) translateY(0) scale(1); }
    .char.off-left { left:-24%; transform:translateX(-50%) translateY(16px) scale(.985); } .char.off-right { left:124%; transform:translateX(-50%) translateY(16px) scale(.985); }
    .haein.expr-0 { background-image:url("../../assets/images/characters/seo-haein/cutins/expr-0.png"); }
    .haein.expr-1 { background-image:url("../../assets/images/characters/seo-haein/cutins/expr-1.png"); }
    .haein.expr-2 { background-image:url("../../assets/images/characters/seo-haein/cutins/expr-2.png"); }
    .haein.expr-3 { background-image:url("../../assets/images/characters/seo-haein/cutins/expr-3.png"); }
    .haein.expr-4 { background-image:url("../../assets/images/characters/seo-haein/cutins/expr-4.png"); }
    .haein.expr-5 { background-image:url("../../assets/images/characters/seo-haein/cutins/expr-5.png"); }
    .junwoo.expr-0 { background-image:url("../../assets/images/characters/park-junwoo/cutins/expr-0.png"); }
    .junwoo.expr-1 { background-image:url("../../assets/images/characters/park-junwoo/cutins/expr-1.png"); }
    .junwoo.expr-2 { background-image:url("../../assets/images/characters/park-junwoo/cutins/expr-2.png"); }
    .junwoo.expr-3 { background-image:url("../../assets/images/characters/park-junwoo/cutins/expr-3.png"); }
    .junwoo.expr-4 { background-image:url("../../assets/images/characters/park-junwoo/cutins/expr-4.png"); }
    .junwoo.expr-5 { background-image:url("../../assets/images/characters/park-junwoo/cutins/expr-5.png"); }
    .taeyoon.expr-0 { background-image:url("../../assets/images/characters/choi-taeyoon/cutins/expr-0.png"); }
    .taeyoon.expr-1 { background-image:url("../../assets/images/characters/choi-taeyoon/cutins/expr-1.png"); }
    .taeyoon.expr-2 { background-image:url("../../assets/images/characters/choi-taeyoon/cutins/expr-2.png"); }
    .taeyoon.expr-3 { background-image:url("../../assets/images/characters/choi-taeyoon/cutins/expr-3.png"); }
    .taeyoon.expr-4 { background-image:url("../../assets/images/characters/choi-taeyoon/cutins/expr-4.png"); }
    .taeyoon.expr-5 { background-image:url("../../assets/images/characters/choi-taeyoon/cutins/expr-5.png"); }
    .minseo { aspect-ratio:330.2/793; background-image:url("../../assets/images/characters/han-minseo/expression-sheet-knee-up-transparent-v3.png"); background-size:600% 100%; }
    .minseo.expr-0 { background-position:0% 0%; } .minseo.expr-1 { background-position:20% 0%; } .minseo.expr-2 { background-position:40% 0%; } .minseo.expr-3 { background-position:60% 0%; } .minseo.expr-4 { background-position:80% 0%; } .minseo.expr-5 { background-position:100% 0%; }
    .dialogue-box { position:absolute; left:22px; right:22px; bottom:calc(22px + env(safe-area-inset-bottom)); min-height:132px; padding:15px 16px; border-radius:22px; background:linear-gradient(145deg, rgba(255,255,255,.18), rgba(255,255,255,.07) 42%, rgba(7,18,27,.38)); border:1px solid rgba(255,255,255,.30); box-shadow:0 18px 36px rgba(0,0,0,.30), inset 0 1px 0 rgba(255,255,255,.18); backdrop-filter:blur(18px) saturate(1.24); z-index:13; cursor:pointer; }
    .name-row { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:10px; } .speaker { color:var(--cyan); font-size:13px; font-weight:900; letter-spacing:.02em; } .counter { color:rgba(247,251,255,.44); font-size:12px; font-weight:800; }
    .line { min-height:58px; color:#f8fcff; font-size:clamp(16px,4.2vw,20px); font-weight:690; line-height:1.48; word-break:keep-all; text-shadow:0 2px 10px rgba(0,0,0,.72); } .line.muted { color:rgba(247,251,255,.84); font-style:italic; }
    .next-mark { position:absolute; right:20px; bottom:13px; width:10px; height:10px; border-right:2px solid rgba(129,236,255,.78); border-bottom:2px solid rgba(129,236,255,.78); transform:rotate(45deg); animation:bob 850ms ease-in-out infinite; }
    .fade { position:absolute; inset:0; background:#e8fbff; opacity:0; pointer-events:none; z-index:22; } .fade.play { animation:flash 720ms ease forwards; }
    @keyframes bob { 0%,100% { translate:0 0; opacity:.55; } 50% { translate:0 4px; opacity:1; } } @keyframes flash { 0%,100% { opacity:0; } 45% { opacity:.72; } }
  </style>
</head>
<body>
  <main class="phone" id="phone" aria-label="Episode 3 visual novel scene">
    <div class="bg"></div><div class="scene-vignette"></div><div class="focus-dim" id="focusDim"></div>
    <div class="topbar"><div class="chapter">EP.03 CLUBROOM GHOST TRACE</div><div class="small-actions"><button class="ghost-button" id="autoBtn" type="button">AUTO</button><button class="ghost-button" id="skipBtn" type="button">SKIP</button></div></div>
    <div class="char haein off-left" id="haein"></div><div class="char taeyoon off-right" id="taeyoon"></div><div class="char junwoo off-left" id="junwoo"></div><div class="char minseo off-right" id="minseo"></div>
    <section class="dialogue-box" id="dialogueBox"><div class="name-row"><div class="speaker" id="speaker">강지호</div><div class="counter" id="counter">1 / 1</div></div><div class="line" id="line"></div><div class="next-mark"></div></section>
    <div class="fade" id="fade"></div>
  </main>
  <script src="../shared-audio.js"></script>
  <script>
    window.HLTAudio.init({ bgm:'../../assets/audio/mobile/episode-03/bgm-episode-03.mp3', bgmVolume:0.27, sfx:{ click:'../../assets/audio/mobile/common/sfx-click.mp3' } });
    const beats = [
      { type:'narration', speaker:' ', text:'동아리방의 불이 아직 꺼지지 않은 밤. 공용 PC 앞에 몇 사람이 모여 있었다.', chars:{} },
      { type:'narration', speaker:' ', text:'모니터에는 평소와 다른 팝업이 떠 있었고, 브라우저는 닫아도 다시 열리는 것처럼 보였다.', chars:{} },
      { type:'dialogue', speaker:'서해인', text:'지호야, 마침 잘 왔다. 이 PC 좀 봐줄 수 있어?', chars:{ haein:['left',1] } },
      { type:'dialogue', speaker:'강지호', text:'동아리 공용 PC요? 화면이 왜 이렇게 느려요?', chars:{ haein:['left',1] } },
      { type:'dialogue', speaker:'서해인', text:'오늘 오후부터 이상했어. 브라우저를 열면 원래 홈페이지 말고 이상한 검색 페이지가 먼저 떠.', chars:{ haein:['left',2] } },
      { type:'dialogue', speaker:'서해인', text:'처음엔 누가 설정을 잘못 건드린 줄 알았는데, 다시 켜도 똑같아.', chars:{ haein:['left',2] } },
      { type:'dialogue', speaker:'강지호', text:'발견한 건 선배가 처음이에요?', chars:{ haein:['left',1] } },
      { type:'dialogue', speaker:'서해인', text:'응. 자료 정리하려고 켰는데 자동으로 창이 뜨더라. 그래서 바로 더 만지지 않고 기다렸어.', chars:{ haein:['left',1] } },
      { type:'dialogue', speaker:'강지호', text:'그건 잘하셨어요. 증상이 보이면 먼저 멈추고, 바뀐 기록부터 봐야 하니까요.', chars:{ haein:['left',1] } },
      { type:'dialogue', speaker:'최태윤', text:'저기... 그거 혹시 내가 깐 확장 프로그램 때문일 수도 있어.', chars:{ haein:['left',1], taeyoon:['right',3] } },
      { type:'dialogue', speaker:'서해인', text:'태윤아, 너 뭘 설치했어?', chars:{ haein:['left',2], taeyoon:['right',3] } },
      { type:'dialogue', speaker:'최태윤', text:'어제 외국 자료 볼 일이 있어서 번역 확장 하나 깔았어. 리뷰도 괜찮아 보여서...', chars:{ haein:['left',2], taeyoon:['right',4] } },
      { type:'dialogue', speaker:'강지호', text:'설치한 뒤에 바로 이상해졌어?', chars:{ haein:['left',1], taeyoon:['right',4] } },
      { type:'dialogue', speaker:'최태윤', text:'바로는 아니었는데, 브라우저 시작 페이지가 바뀐 것 같긴 했어. 그냥 내가 잘못 누른 줄 알았지.', chars:{ haein:['left',2], taeyoon:['right',4] } },
      { type:'dialogue', speaker:'서해인', text:'공용 PC에 설치할 거면 최소한 동아리방에 말은 했어야 해.', chars:{ haein:['left',2], taeyoon:['right',4] } },
      { type:'dialogue', speaker:'최태윤', text:'미안. 편하게 쓰려고 한 건데 이렇게 될 줄 몰랐어.', chars:{ haein:['left',1], taeyoon:['right',4] } },
      { type:'dialogue', speaker:'박준우', text:'그게 문제야. 공용 PC는 누가 쓰는지 모르니까 작은 설치 하나도 영향이 커.', chars:{ junwoo:['left',2], taeyoon:['right',4] } },
      { type:'dialogue', speaker:'박준우', text:'동아리 이름이 보안 동아리인데, 관리가 이렇게 느슨하면 밖에서 보면 웃어.', chars:{ junwoo:['left',2], taeyoon:['right',4] } },
      { type:'dialogue', speaker:'최태윤', text:'알겠어. 진짜 미안해. 그런데 이게 악성인지 아닌지는 아직 모르는 거지?', chars:{ junwoo:['left',1], taeyoon:['right',4] } },
      { type:'dialogue', speaker:'강지호', text:'맞아. 지금은 누가 잘못했다보다, 실제로 무엇이 바뀌었는지 확인하는 게 먼저야.', chars:{ junwoo:['left',1], taeyoon:['right',3] } },
      { type:'dialogue', speaker:'한민서', text:'지호야, 지난번 내 계정 때도 그랬잖아. 무서운 말보다 기록이 먼저였어.', chars:{ junwoo:['left',1], minseo:['right',1] } },
      { type:'dialogue', speaker:'한민서', text:'이번에도 차근차근 보면 될 거야. 이상해 보이는 것과 진짜 원인은 다를 수 있으니까.', chars:{ junwoo:['left',1], minseo:['right',0] } },
      { type:'dialogue', speaker:'강지호', text:'응. 먼저 브라우저 확장 목록을 볼게. 설치된 이름, 권한, 설치 시간을 확인해야 해.', chars:{ haein:['left',1], minseo:['right',0] } },
      { type:'dialogue', speaker:'서해인', text:'그 다음은?', chars:{ haein:['left',1], minseo:['right',0] } },
      { type:'dialogue', speaker:'강지호', text:'시작 프로그램이나 작업 스케줄러도 봐야 해요. 브라우저를 닫아도 다시 뜬다면 자동 실행이 있을 수 있어요.', chars:{ haein:['left',1], minseo:['right',1] } },
      { type:'dialogue', speaker:'박준우', text:'다운로드 기록도 확인해야겠지. 어떤 파일이 들어왔는지 알아야 하니까.', chars:{ junwoo:['left',1], minseo:['right',1] } },
      { type:'dialogue', speaker:'강지호', text:'맞아요. 그리고 최근 실행 파일도 볼게요. 단순 확장인지, 별도 실행 파일까지 있는지 구분해야 해요.', chars:{ junwoo:['left',1], minseo:['right',0] } },
      { type:'dialogue', speaker:'서해인', text:'혹시 외부 해킹이면 어떻게 해?', chars:{ haein:['left',2], minseo:['right',0] } },
      { type:'dialogue', speaker:'강지호', text:'그 결론은 아직 빨라요. 외부 접속 흔적이 있어도 이번 증상의 직접 원인인지 따로 봐야 해요.', chars:{ haein:['left',2], minseo:['right',1] } },
      { type:'dialogue', speaker:'강지호', text:'확장 프로그램, 자동 실행, 다운로드 기록이 맞물리면 이번 증상은 설명돼요. 그 밖의 흔적은 별도 메모로 남기고요.', chars:{ haein:['left',1], minseo:['right',1] } },
      { type:'dialogue', speaker:'최태윤', text:'그럼 내가 깐 확장 프로그램이 원인이면 바로 지우면 되는 거야?', chars:{ haein:['left',1], taeyoon:['right',3] } },
      { type:'dialogue', speaker:'강지호', text:'지우기 전에 먼저 기록해야 해. 설치 시간과 권한을 남겨야 왜 문제가 생겼는지 설명할 수 있어.', chars:{ haein:['left',1], taeyoon:['right',3] } },
      { type:'dialogue', speaker:'박준우', text:'좋아. 확인 끝나면 공용 PC 설치 규칙도 새로 정하자. 이번 일 그냥 넘기면 반복돼.', chars:{ junwoo:['left',2], taeyoon:['right',4] } },
      { type:'dialogue', speaker:'한민서', text:'지호야, 부담 갖지 마. 지금 네가 할 일은 범인을 찾는 게 아니라 흐름을 정리하는 거잖아.', chars:{ junwoo:['left',1], minseo:['right',1] } },
      { type:'dialogue', speaker:'강지호', text:'응. 증상, 변경점, 자동 실행, 그리고 관련 없는 흔적까지 구분해서 볼게.', chars:{ haein:['left',1], minseo:['right',1] } },
      { type:'dialogue', speaker:'서해인', text:'그럼 부탁할게. 발견한 화면은 그대로 뒀고, 아무것도 삭제하지 않았어.', chars:{ haein:['left',1], minseo:['right',0] } },
      { type:'dialogue', speaker:'강지호', text:'좋아요. 이제 동아리 공용 PC 기록을 확인해볼게요.', chars:{ haein:['left',1], minseo:['right',0] } },
      { type:'narration', speaker:' ', text:'동아리 공용 PC 조사로 이동한다.', chars:{}, transition:true }
    ];
    const ids=['haein','junwoo','taeyoon','minseo'];
    const els=Object.fromEntries(ids.map(id=>[id,document.getElementById(id)]));
    const focusDim=document.getElementById('focusDim'), speaker=document.getElementById('speaker'), line=document.getElementById('line'), counter=document.getElementById('counter'), dialogueBox=document.getElementById('dialogueBox'), fade=document.getElementById('fade'), autoBtn=document.getElementById('autoBtn'), skipBtn=document.getElementById('skipBtn');
    let index=0, auto=false, autoTimer=null, typeTimer=null, isTyping=false, currentText='';
    function stopTyping(){ if(typeTimer) clearInterval(typeTimer); typeTimer=null; isTyping=false; }
    function completeText(){ stopTyping(); line.textContent=currentText; }
    function typeText(text){ stopTyping(); currentText=text; line.textContent=''; let i=0; isTyping=true; typeTimer=setInterval(()=>{ line.textContent += text[i] || ''; i += 1; if(i > text.length) stopTyping(); }, 18); }
    function applyCharacters(chars){ let shown=false; ids.forEach(id=>{ const el=els[id]; el.className='char '+id+' '+(id==='haein'?'off-left':id==='junwoo'?'off-left':'off-right'); if(chars[id]){ const [slot,expr]=chars[id]; el.className='char '+id+' '+slot+' show expr-'+expr; shown=true; } }); focusDim.classList.toggle('on', shown); }
    function goInvestigation(){ window.location.href='../episode-03-investigation-menu/index.html'; }
    function showBeat(){ const beat=beats[index]; if(!beat) return; clearTimeout(autoTimer); stopTyping(); applyCharacters(beat.chars || {}); speaker.textContent=beat.speaker || ' '; counter.textContent=`${index+1} / ${beats.length}`; line.classList.toggle('muted', beat.type==='narration'); typeText(beat.text); if(beat.transition){ fade.classList.remove('play'); void fade.offsetWidth; fade.classList.add('play'); autoTimer=setTimeout(goInvestigation,1450); } if(auto && !beat.transition) autoTimer=setTimeout(next, Math.max(1500, beat.text.length * 85)); }
    function next(){ if(isTyping){ completeText(); return; } if(index < beats.length - 1){ index += 1; showBeat(); } }
    dialogueBox.addEventListener('click', next); document.getElementById('phone').addEventListener('click', e=>{ if(e.target.closest('button') || e.target.closest('.dialogue-box')) return; next(); });
    autoBtn.addEventListener('click',()=>{ auto=!auto; autoBtn.textContent=auto?'AUTO ON':'AUTO'; if(auto) showBeat(); else clearTimeout(autoTimer); });
    skipBtn.addEventListener('click',()=>{ stopTyping(); index=beats.length-1; showBeat(); });
    showBeat();
  </script>
</body>
</html>
