<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Hacker Life: Trace - Episode 02 Result</title>
  <style>
    :root { --phone-w:min(100vw,430px); --phone-h:min(100dvh,932px); --ink:#f7fbff; --cyan:#7eeaff; --red:#ff8f9b; --green:#5fe2ad; font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif; }
    * { box-sizing:border-box; } html,body { height:100%; }
    body { margin:0; display:grid; place-items:center; overflow:hidden; color:var(--ink); background:radial-gradient(circle at 50% 8%, rgba(126,234,255,.14), transparent 34%), linear-gradient(160deg,#020409,#07131d 54%,#020409); }
    .phone { position:relative; width:var(--phone-w); height:var(--phone-h); max-height:932px; aspect-ratio:9/16; overflow:hidden; background:#05080d; box-shadow:0 28px 80px rgba(0,0,0,.62); isolation:isolate; }
    .bg { position:absolute; inset:0; background-image:linear-gradient(to bottom, rgba(0,0,0,.22), rgba(0,0,0,.72)), url("../../assets/images/mobile/backgrounds/mob-bg-home-living-room-v1.png"); background-size:cover; background-position:center; filter:saturate(.9) brightness(.68); transform:scale(1.02); }
    .topbar { position:absolute; top:calc(14px + env(safe-area-inset-top)); left:16px; right:16px; display:flex; justify-content:space-between; align-items:center; z-index:8; }
    .pill { padding:8px 12px; border-radius:999px; background:rgba(4,10,16,.48); border:1px solid rgba(255,255,255,.20); color:rgba(247,251,255,.80); backdrop-filter:blur(12px); font-size:12px; font-weight:850; letter-spacing:.05em; }
    .parents { position:absolute; left:50%; bottom:150px; width:min(78vw,340px); aspect-ratio:660/793; background-image:url("../../assets/images/characters/parents/expression-sheet-knee-up-transparent-v1.png"); background-size:300% 100%; background-position:50% 0%; filter:drop-shadow(0 28px 26px rgba(0,0,0,.52)); transform:translateX(-50%); z-index:4; }
    .dialogue { position:absolute; left:22px; right:22px; bottom:calc(22px + env(safe-area-inset-bottom)); min-height:136px; padding:16px; border-radius:22px; background:linear-gradient(145deg, rgba(255,255,255,.18), rgba(255,255,255,.07) 42%, rgba(7,18,27,.42)); border:1px solid rgba(255,255,255,.30); box-shadow:0 18px 36px rgba(0,0,0,.34), inset 0 1px 0 rgba(255,255,255,.16); backdrop-filter:blur(18px) saturate(1.24); z-index:9; cursor:pointer; }
    .speaker { color:var(--cyan); font-size:13px; font-weight:900; margin-bottom:10px; } .line { color:#f8fcff; font-size:clamp(17px,4.5vw,21px); font-weight:760; line-height:1.48; word-break:keep-all; } .next-mark { position:absolute; right:20px; bottom:13px; width:10px; height:10px; border-right:2px solid rgba(126,234,255,.78); border-bottom:2px solid rgba(126,234,255,.78); transform:rotate(45deg); }
    .result { position:absolute; inset:calc(68px + env(safe-area-inset-top)) 18px calc(20px + env(safe-area-inset-bottom)); z-index:12; display:none; flex-direction:column; gap:10px; min-height:0; }
    .result.show { display:flex; }
    .result-card { padding:15px 14px; border-radius:22px; background:linear-gradient(145deg, rgba(255,255,255,.16), rgba(255,255,255,.06)), rgba(5,10,16,.82); border:1px solid rgba(255,255,255,.24); box-shadow:0 20px 44px rgba(0,0,0,.38), inset 0 1px 0 rgba(255,255,255,.12); backdrop-filter:blur(20px) saturate(1.15); }
    .status { font-size:13px; font-weight:950; letter-spacing:.08em; margin-bottom:8px; } .status.success { color:var(--green); } .status.fail { color:var(--red); }
    h1 { margin:0; font-size:clamp(21px,5.6vw,28px); line-height:1.22; font-weight:930; word-break:keep-all; }
    .section-title { color:var(--cyan); font-size:13px; font-weight:900; margin:2px 0 8px; }
    .list { display:grid; gap:8px; } .scroll-list { overflow-y:auto; padding-right:3px; overscroll-behavior:contain; }
    #detailList.scroll-list { max-height:170px; } #evidenceList.scroll-list { max-height:230px; } #evidenceBlock { min-height:0; flex:1 1 auto; overflow:hidden; }
    .item { padding:10px 11px; border-radius:14px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.14); color:rgba(247,251,255,.88); font-size:13px; font-weight:720; line-height:1.42; word-break:keep-all; }
    .actions { flex:0 0 auto; display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .action { min-height:50px; border:1px solid rgba(255,255,255,.20); border-radius:16px; background:rgba(255,255,255,.07); color:var(--ink); font-family:inherit; font-size:14px; font-weight:850; cursor:pointer; }
    .action.primary { border-color:rgba(126,234,255,.42); background:rgba(126,234,255,.11); }
    .stamp { position:absolute; left:50%; top:43%; z-index:40; width:min(82vw,350px); height:auto; transform:translate(-50%, -50%) rotate(-37deg) scale(2.1); opacity:0; pointer-events:none; filter:drop-shadow(0 22px 26px rgba(0,0,0,.38)); mix-blend-mode:screen; }
    .stamp.show { animation:stampHit 2600ms cubic-bezier(.18,.84,.26,1) forwards; }
    @keyframes stampHit { 0% { opacity:0; transform:translate(-50%, -50%) rotate(-37deg) scale(2.1); filter:blur(2px) drop-shadow(0 22px 26px rgba(0,0,0,.38)); } 13% { opacity:1; transform:translate(-50%, -50%) rotate(-37deg) scale(.92); filter:blur(0) drop-shadow(0 22px 26px rgba(0,0,0,.38)); } 19% { transform:translate(-50%, -50%) rotate(-34deg) scale(1.03); } 24% { transform:translate(-50%, -50%) rotate(-39deg) scale(.99); } 31% { transform:translate(-50%, -50%) rotate(-37deg) scale(1); } 72% { opacity:1; } 100% { opacity:0; transform:translate(-50%, -50%) rotate(-37deg) scale(1.04); } }
    .hidden { display:none; }
  </style>
</head>
<body>
  <main class="phone" aria-label="Episode 2 result">
    <div class="bg"></div>
    <div class="topbar"><div class="pill">EP.02 THE LINK AT HOME</div><div class="pill" id="modePill">분석 결과</div></div>
    <section id="rebuttalScene"><div class="parents"></div><div class="dialogue" id="dialogueBox"><div class="speaker" id="speakerName">어머니</div><div class="line" id="rebuttalLine"></div><div class="next-mark"></div></div></section>
    <img class="stamp" id="stamp" src="../../assets/images/mobile/ui/result-stamp-failed-v1.png" alt="" aria-hidden="true" />
    <section class="result" id="resultView"><div class="result-card"><div class="status" id="statusText">RESULT</div><h1 id="headline">분석 결과</h1></div><div class="result-card"><div class="section-title" id="detailTitle">판정 근거</div><div class="list scroll-list" id="detailList"></div></div><div class="result-card" id="evidenceBlock"><div class="section-title">사용한 증거</div><div class="list scroll-list" id="evidenceList"></div></div><div class="actions" id="actions"></div></section>
  </main>
  <script src="../shared-audio.js"></script>
  <script>
    const required=['ep02-message-original-01-true.png','ep02-link-url-01-true.png','ep02-browser-history-01-true.png','ep02-card-alert-01-true.png','ep02-app-install-01-true.png'];
    const traps=['ep02-message-original-02-trap.png','ep02-link-url-02-trap.png','ep02-browser-history-02-trap.png','ep02-card-alert-02-trap.png','ep02-app-install-02-trap.png','ep02-photo-access-01-sensitive.png','ep02-contact-access-02-sensitive.png'];
    const evidenceMeta={
      'ep02-message-original-01-true.png':{source:'문자 원문',text:'배송 주소 확인을 요구하는 사칭 문자와 외부 링크가 확인된다.'},
      'ep02-message-original-02-trap.png':{source:'문자 원문',text:'오래된 정상 배송/광고 문자로 이번 사건과 직접 연결되지 않는다.'},
      'ep02-link-url-01-true.png':{source:'링크 주소',text:'문자에서 열린 외부 배송 확인 도메인이 확인된다.'},
      'ep02-link-url-02-trap.png':{source:'링크 주소',text:'검색 결과 주소로 피싱 문자 링크의 근거가 아니다.'},
      'ep02-browser-history-01-true.png':{source:'브라우저 기록',text:'문자 링크와 카드 입력 페이지까지 열린 흔적이 있지만 완료 기록은 없다.'},
      'ep02-browser-history-02-trap.png':{source:'브라우저 기록',text:'평소 웹 사용 기록으로 피싱 흐름을 설명하지 못한다.'},
      'ep02-card-alert-01-true.png':{source:'카드 알림',text:'피싱 링크 접속 시간대에 새 결제 승인 알림이 없다.'},
      'ep02-card-alert-02-trap.png':{source:'카드 알림',text:'오래된 정상/거절 알림으로 이번 사건 시간대 피해 근거가 아니다.'},
      'ep02-app-install-01-true.png':{source:'앱 설치 기록',text:'링크 이후 새 앱 설치, APK 다운로드, 새 권한 허용이 보이지 않는다.'},
      'ep02-app-install-02-trap.png':{source:'앱 설치 기록',text:'이전부터 있던 앱/업데이트 기록으로 이번 링크 직후 설치가 아니다.'},
      'ep02-photo-access-01-sensitive.png':{source:'사진 접근 기록',text:'조사 범위를 벗어난 개인 사진 접근 기록이다.'},
      'ep02-contact-access-02-sensitive.png':{source:'연락처 접근 기록',text:'조사 범위를 벗어난 개인 연락처 접근 기록이다.'}
    };
    const evidence=JSON.parse(sessionStorage.getItem('ep02Evidence') || '[]');
    const conclusion=sessionStorage.getItem('ep02Conclusion') || '';
    const evidenceSet=new Set(evidence);
    const hasTrap=traps.some(id=>evidenceSet.has(id));
    const isSuccess=conclusion==='scope-limited' && required.every(id=>evidenceSet.has(id)) && !hasTrap;
    window.HLTAudio.init({ bgm:'../../assets/audio/mobile/episode-02/bgm-episode-02.mp3', bgmVolume:isSuccess?0.31:0.29, sfx:{ click:'../../assets/audio/mobile/common/sfx-click.mp3', stamp:'../../assets/audio/mobile/common/sfx-stamp.mp3' } });
    const rebuttalScene=document.getElementById('rebuttalScene'), resultView=document.getElementById('resultView'), rebuttalLine=document.getElementById('rebuttalLine'), dialogueBox=document.getElementById('dialogueBox'), speakerName=document.getElementById('speakerName'), statusText=document.getElementById('statusText'), headline=document.getElementById('headline'), detailTitle=document.getElementById('detailTitle'), detailList=document.getElementById('detailList'), evidenceList=document.getElementById('evidenceList'), actions=document.getElementById('actions'), modePill=document.getElementById('modePill'), stamp=document.getElementById('stamp');
    function failureCategories(){ const list=[]; if(conclusion!=='scope-limited') list.push('선택한 결론이 수집한 기록보다 앞서 나갔다.'); if(hasTrap) list.push('이번 사건과 직접 관련 없는 기록이 결론에 섞여 있다.'); if(!evidenceSet.has('ep02-message-original-01-true.png')) list.push('피싱 문자의 출발점을 설명하는 근거가 부족하다.'); if(!evidenceSet.has('ep02-link-url-01-true.png')) list.push('문자 링크가 외부 주소였는지 확인하는 근거가 부족하다.'); if(!evidenceSet.has('ep02-browser-history-01-true.png')) list.push('링크가 실제로 어디까지 열렸는지 보여주는 근거가 부족하다.'); if(!evidenceSet.has('ep02-card-alert-01-true.png')) list.push('결제 피해가 있었는지 판단할 승인 알림 근거가 부족하다.'); if(!evidenceSet.has('ep02-app-install-01-true.png')) list.push('앱 설치나 권한 허용으로 이어졌는지 확인하는 근거가 부족하다.'); if(!list.length) list.push('근거 조합은 가까워졌지만 결론 표현이 아직 정확하지 않다.'); return list; }
    function rebuttalText(){ if(conclusion==='phone-hacked'){ speakerName.textContent='아버지'; return '그렇게 말하려면 새 앱 설치나 권한 허용 기록이 있어야 하지 않겠냐? 지금은 무서운 쪽으로 너무 빨리 간 것 같아.'; } if(conclusion==='card-stolen'){ speakerName.textContent='어머니'; return '결제 승인 알림이 없는데 카드가 빠져나갔다고 할 수 있어? 확인한 것만 말해줘.'; } if(conclusion==='nothing'){ speakerName.textContent='어머니'; return '문자 링크랑 카드 입력 화면까지 열렸는데 아무 일 아니라고 넘겨도 되는 거야?'; } speakerName.textContent='아버지'; return '방향은 맞는 것 같은데, 빠진 기록이 있으면 결론이 흔들리지 않을까?'; }
    function renderList(target, items){ target.innerHTML=''; items.forEach(text=>{ const div=document.createElement('div'); div.className='item'; div.textContent=text; target.appendChild(div); }); }
    function renderEvidence(){ evidenceList.innerHTML=''; evidence.forEach(id=>{ const item=evidenceMeta[id]; if(!item) return; const div=document.createElement('div'); div.className='item'; div.textContent=`${item.source}: ${item.text}`; evidenceList.appendChild(div); }); if(!evidenceList.children.length) renderList(evidenceList,['제출된 증거가 없다.']); }
    function playStamp(success){ window.HLTAudio.play('stamp'); stamp.src=success?'../../assets/images/mobile/ui/result-stamp-success-v1.png':'../../assets/images/mobile/ui/result-stamp-failed-v1.png'; stamp.className='stamp'; void stamp.offsetWidth; stamp.classList.add('show'); }
    function showResult(){ rebuttalScene.classList.add('hidden'); resultView.classList.add('show'); renderEvidence(); playStamp(isSuccess); if(isSuccess){ modePill.textContent='CLEAR'; statusText.textContent='ANALYSIS SUCCESS'; statusText.className='status success'; headline.textContent='피해 범위는 제한된 것으로 정리된다.'; detailTitle.textContent='정답 근거'; renderList(detailList,['사칭 배송 문자가 출발점으로 확인된다.','문자 링크는 외부 배송 확인 주소로 이어졌다.','브라우저 기록상 링크와 카드 입력 페이지는 열렸지만 완료 흐름은 보이지 않는다.','해당 시간대 새 결제 승인 알림이 없다.','새 앱 설치나 권한 허용 기록이 없어 휴대폰 전체 침해로 단정할 수 없다.']); actions.innerHTML='<button class="action" type="button" id="backInvestigation">기록 다시 보기</button><button class="action primary" type="button" id="finishEpisode">사건 재구성</button>'; document.getElementById('backInvestigation').addEventListener('click',()=>window.location.href='../episode-02-investigation-menu/index.html'); document.getElementById('finishEpisode').addEventListener('click',()=>window.location.href='../episode-02-recap-animation/index.html'); } else { modePill.textContent='FAILED'; statusText.textContent='ANALYSIS FAILED'; statusText.className='status fail'; headline.textContent='피해 범위를 다시 정리해야 한다.'; detailTitle.textContent='부족한 부분'; renderList(detailList,failureCategories()); actions.innerHTML='<button class="action" type="button" id="retryFull">처음부터 다시</button><button class="action primary" type="button" id="retryInvestigation">다시 조사하기</button>'; document.getElementById('retryInvestigation').addEventListener('click',()=>window.location.href='../episode-02-investigation-menu/index.html'); document.getElementById('retryFull').addEventListener('click',()=>{ sessionStorage.removeItem('ep02Evidence'); sessionStorage.removeItem('ep02Conclusion'); window.location.href='../episode-02-vn-scene/index.html'; }); } }
    if(isSuccess){ rebuttalScene.classList.add('hidden'); showResult(); } else { rebuttalLine.textContent=rebuttalText(); dialogueBox.addEventListener('click',showResult); }
  </script>
</body>
</html>
