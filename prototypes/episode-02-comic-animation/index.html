<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Hacker Life: Trace - Episode 02 Comic Intro</title>
  <style>
    :root {
      --phone-w: min(100vw, 430px);
      --phone-h: min(100dvh, 932px);
      --cyan: #7eeaff;
      --ink: #f7fbff;
      --image: url("../../assets/images/mobile/episode-02/ep02-phishing-comic-v1.png");
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--ink);
      background: radial-gradient(circle at 50% 10%, rgba(126,234,255,.14), transparent 32%), linear-gradient(160deg, #020409, #07131d 54%, #020409);
    }
    .phone { position: relative; width: var(--phone-w); height: var(--phone-h); max-height: 932px; aspect-ratio: 9 / 16; overflow: hidden; background: #02050a; box-shadow: 0 28px 80px rgba(0,0,0,.62); isolation: isolate; }
    .stage { position: absolute; inset: 0; background: #02050a; }
    .panel, .full-page { position: absolute; inset: 0; background-image: var(--image); background-size: cover; background-position: center; }
    .panel { opacity: 0; transform-origin: center; filter: drop-shadow(0 20px 18px rgba(0,0,0,.62)); will-change: transform, opacity; }
    .panel-1 { clip-path: polygon(0 0, 100% 0, 100% 22.5%, 0 28.5%); animation: panelFromLeft 1080ms cubic-bezier(.18,.94,.2,1) 220ms forwards; }
    .panel-2 { clip-path: polygon(0 27.3%, 100% 21.4%, 100% 47.8%, 0 42.2%); animation: panelFromRight 1120ms cubic-bezier(.18,.94,.2,1) 1320ms forwards; }
    .panel-3 { clip-path: polygon(0 41.0%, 100% 46.8%, 100% 69.0%, 0 74.8%); animation: panelFromLowerLeft 1160ms cubic-bezier(.18,.94,.2,1) 2440ms forwards; }
    .panel-4 { clip-path: polygon(0 73.4%, 100% 67.8%, 100% 100%, 0 100%); animation: panelFromLowerRight 1200ms cubic-bezier(.18,.94,.2,1) 3600ms forwards; }
    .full-page { opacity: 0; transform: scale(1.018); pointer-events: none; animation: revealFull 900ms ease 5200ms forwards; }
    .scanline { position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(255,255,255,.07) 0 1px, transparent 1px 5px), linear-gradient(90deg, transparent, rgba(126,234,255,.10), transparent); opacity: .11; mix-blend-mode: screen; animation: scan 1200ms steps(2,end) infinite; pointer-events: none; }
    .flash { position: absolute; inset: 0; background: #e6fbff; opacity: 0; pointer-events: none; animation: finalFlash 900ms ease 7900ms forwards; }
    .controls { position: absolute; right: 14px; top: calc(14px + env(safe-area-inset-top)); display: flex; gap: 8px; z-index: 20; }
    .control { border: 1px solid rgba(255,255,255,.24); border-radius: 999px; color: rgba(247,251,255,.82); background: rgba(0,0,0,.28); padding: 8px 11px; font-size: 12px; font-weight: 850; cursor: pointer; backdrop-filter: blur(8px); }
    .panel-text { position: absolute; z-index: 9; max-width: 70%; color: #f7fbff; font-weight: 900; line-height: 1.18; text-shadow: 0 3px 12px rgba(0,0,0,.96), 0 0 14px rgba(126,234,255,.28), -2px 0 0 rgba(0,0,0,.58), 2px 0 0 rgba(0,0,0,.58), 0 -2px 0 rgba(0,0,0,.58), 0 2px 0 rgba(0,0,0,.58); opacity: 0; transform: translateY(10px); transition: opacity 320ms ease, transform 320ms ease; pointer-events: none; }
    .panel-text.show { opacity: 1; transform: translateY(0); }
    .text-1 { left: 7%; top: 16.5%; font-size: clamp(17px, 4.8vw, 23px); }
    .text-2 { right: 7%; top: 36.5%; max-width: 58%; text-align: right; font-size: clamp(15px, 4.2vw, 20px); }
    .text-3 { left: 7%; top: 60.2%; max-width: 62%; font-size: clamp(15px, 4.2vw, 20px); }
    .text-4 { right: 7%; bottom: 8.5%; max-width: 67%; text-align: right; font-size: clamp(17px, 4.9vw, 24px); }
    @keyframes panelFromLeft { 0% { opacity:0; transform: translateX(-116%) translateY(-8%) rotate(-7deg) scale(.985); } 72% { opacity:1; transform: translateX(2.4%) rotate(.9deg) scale(1); } 100% { opacity:1; transform: translateX(0) rotate(0); } }
    @keyframes panelFromRight { 0% { opacity:0; transform: translateX(116%) translateY(-4%) rotate(7deg) scale(.985); } 72% { opacity:1; transform: translateX(-2.4%) rotate(-.9deg) scale(1); } 100% { opacity:1; transform: translateX(0) rotate(0); } }
    @keyframes panelFromLowerLeft { 0% { opacity:0; transform: translateX(-112%) translateY(34%) rotate(6deg) scale(.985); } 72% { opacity:1; transform: translateX(2.2%) translateY(-.8%) rotate(-.9deg) scale(1); } 100% { opacity:1; transform: translateX(0) translateY(0) rotate(0); } }
    @keyframes panelFromLowerRight { 0% { opacity:0; transform: translateX(112%) translateY(34%) rotate(-6deg) scale(.985); } 72% { opacity:1; transform: translateX(-2.2%) translateY(-.8%) rotate(.9deg) scale(1); } 100% { opacity:1; transform: translateX(0) translateY(0) rotate(0); } }
    @keyframes revealFull { to { opacity: 1; transform: scale(1); } }
    @keyframes scan { to { transform: translateY(5px); } }
    @keyframes finalFlash { 0%,100% { opacity:0; } 45% { opacity:.58; } }
    @media (prefers-reduced-motion: reduce) { .panel, .full-page, .flash { animation-duration: 1ms !important; animation-delay: 0ms !important; } .panel-text { transition: none; } }
  </style>
</head>
<body>
  <main class="phone" aria-label="Episode 2 phishing comic intro animation">
    <section class="stage" id="stage">
      <div class="panel panel-1"></div>
      <div class="panel panel-2"></div>
      <div class="panel panel-3"></div>
      <div class="panel panel-4"></div>
      <div class="full-page"></div>
      <div class="scanline"></div>
      <div class="flash"></div>
      <div class="controls">
        <button class="control" id="replay" type="button">REPLAY</button>
        <button class="control" id="skip" type="button">SKIP</button>
        <button class="control" id="nextScene" type="button">NEXT</button>
      </div>
      <div class="panel-text text-1" id="text1">집에 돌아온 밤.</div>
      <div class="panel-text text-2" id="text2">평범한 배송 문자가<br>불안을 만들었다.</div>
      <div class="panel-text text-3" id="text3">무서운 말보다 먼저<br>확인할 것이 있었다.</div>
      <div class="panel-text text-4" id="text4">피해는 어디까지<br>이어졌을까?</div>
    </section>
  </main>
  <script src="../shared-audio.js"></script>
  <script>
    window.HLTAudio.init({
      bgm: '../../assets/audio/mobile/episode-02/bgm-episode-02.mp3',
      bgmVolume: 0.30,
      sfx: {
        click: '../../assets/audio/mobile/common/sfx-click.mp3',
        whoosh: '../../assets/audio/mobile/common/sfx-panel-whoosh.mp3'
      }
    });
    const stage = document.getElementById('stage');
    const textItems = [
      { at: 1320, el: document.getElementById('text1') },
      { at: 2740, el: document.getElementById('text2') },
      { at: 4260, el: document.getElementById('text3') },
      { at: 5850, el: document.getElementById('text4') }
    ];
    let timers = [];
    function clearTimers() { timers.forEach(clearTimeout); timers = []; }
    function goNextScene() { window.location.href = '../episode-02-vn-scene/index.html'; }
    function run() {
      clearTimers();
      textItems.forEach(item => item.el.classList.remove('show'));
      [220, 1320, 2440, 3600].forEach(at => timers.push(setTimeout(() => window.HLTAudio.play('whoosh'), at)));
      textItems.forEach(item => timers.push(setTimeout(() => item.el.classList.add('show'), item.at)));
      timers.push(setTimeout(goNextScene, 9800));
    }
    function skipToEnd() {
      clearTimers();
      for (const el of stage.querySelectorAll('.panel, .full-page, .flash')) {
        el.style.animationDelay = '0ms';
        el.style.animationDuration = '1ms';
      }
      textItems.forEach(item => item.el.classList.add('show'));
      timers.push(setTimeout(goNextScene, 1200));
    }
    document.getElementById('replay').addEventListener('click', () => location.reload());
    document.getElementById('skip').addEventListener('click', skipToEnd);
    document.getElementById('nextScene').addEventListener('click', goNextScene);
    run();
  </script>
</body>
</html>
