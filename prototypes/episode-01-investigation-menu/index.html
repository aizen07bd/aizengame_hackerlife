<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Hacker Life: Trace - LMS Activity Menu</title>
  <style>
    :root {
      --phone-w: min(100vw, 430px);
      --phone-h: min(100dvh, 932px);
      --ink: #f7fbff;
      --muted: rgba(247,251,255,.68);
      --cyan: #7eeaff;
      --cyan-dim: rgba(126,234,255,.28);
      --glass: rgba(255,255,255,.12);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--ink);
      background:
        radial-gradient(circle at 50% 8%, rgba(126,234,255,.14), transparent 34%),
        linear-gradient(160deg, #020409, #07131d 54%, #020409);
    }

    .phone {
      position: relative;
      width: var(--phone-w);
      height: var(--phone-h);
      max-height: 932px;
      aspect-ratio: 9 / 16;
      overflow: hidden;
      background: #05080d;
      box-shadow: 0 28px 80px rgba(0,0,0,.62);
      isolation: isolate;
    }

    .topbar {
      position: absolute;
      top: calc(14px + env(safe-area-inset-top));
      left: 16px;
      right: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 20;
      pointer-events: none;
    }
    .pill {
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(4, 10, 16, .48);
      border: 1px solid rgba(255,255,255,.20);
      backdrop-filter: blur(12px);
      color: rgba(247,251,255,.78);
      font-size: 12px;
      font-weight: 850;
      letter-spacing: .05em;
    }

    .monitor-area {
      position: absolute;
      top: calc(54px + env(safe-area-inset-top));
      left: 0;
      right: 0;
      height: 43%;
      overflow: hidden;
      background: #071018;
    }
    .monitor-area::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(to bottom, rgba(1,6,10,.08), rgba(1,6,10,.38)),
        url("../../assets/images/mobile/investigation/episode-01/lms-monitor-top-v2.png");
      background-size: cover;
      background-position: center;
      transform: scale(1.02);
    }
    .monitor-area::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(0deg, rgba(255,255,255,.08) 0 1px, transparent 1px 5px),
        linear-gradient(to bottom, transparent, rgba(0,0,0,.25));
      opacity: .32;
      mix-blend-mode: screen;
      pointer-events: none;
    }

    .menu-panel {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 54%;
      padding: 34px 20px calc(18px + env(safe-area-inset-bottom));
      background:
        linear-gradient(to bottom, rgba(5,10,16,0), rgba(5,10,16,.68) 10%, rgba(4,9,14,.96) 36%, #04090e 100%);
      z-index: 8;
    }

    .menu-title {
      margin-bottom: 12px;
      padding-top: 4px;
    }
    .kicker {
      color: var(--cyan);
      font-size: 13px;
      font-weight: 900;
      letter-spacing: .06em;
      margin-bottom: 8px;
    }
    h1 {
      margin: 0;
      max-width: 330px;
      font-size: clamp(18px, 4.9vw, 22px);
      line-height: 1.34;
      font-weight: 820;
      letter-spacing: 0;
      word-break: keep-all;
    }
    .target { display: none; }

    .prompt {
      margin: 0 0 18px;
      color: rgba(247,251,255,.66);
      font-size: 13px;
      font-weight: 640;
      line-height: 1.45;
      word-break: keep-all;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .menu-card {
      position: relative;
      min-height: 62px;
      padding: 0 13px;
      border: 1px solid rgba(255,255,255,.20);
      border-radius: 17px;
      background: linear-gradient(145deg, rgba(34,42,51,.92), rgba(18,25,32,.88));
      color: var(--ink);
      box-shadow: 0 12px 25px rgba(0,0,0,.24), inset 0 1px 0 rgba(255,255,255,.08);
      text-align: left;
      cursor: pointer;
      overflow: hidden;
      contain: paint;
      transition: transform 120ms ease, border-color 120ms ease, background 120ms ease;
    }
    .menu-card:active { transform: translateY(1px) scale(.99); }
    .menu-card:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
    .menu-card:hover { border-color: rgba(126,234,255,.42); background: linear-gradient(145deg, rgba(39,49,59,.96), rgba(19,28,36,.92)); }
    .card-title {
      display: block;
      font-size: 15px;
      font-weight: 850;
      line-height: 1.25;
    }
    .card-sub { display: none; }

    .investigation-footer {
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: calc(16px + env(safe-area-inset-bottom));
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      padding: 10px;
      border-radius: 24px;
      background: linear-gradient(145deg, rgba(255,255,255,.10), rgba(255,255,255,.035)), rgba(2,8,13,.74);
      border: 1px solid rgba(126,234,255,.18);
      box-shadow: 0 18px 40px rgba(0,0,0,.34), inset 0 1px 0 rgba(255,255,255,.10);
      backdrop-filter: blur(18px) saturate(1.15);
      opacity: 0;
      transform: translateY(12px);
      pointer-events: none;
      transition: opacity 220ms ease, transform 220ms ease;
      z-index: 12;
    }
    .investigation-footer.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
    .footer-action {
      min-height: 44px;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 15px;
      background: rgba(255,255,255,.055);
      color: rgba(247,251,255,.88);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.08);
      font-family: inherit;
      font-size: 13px;
      font-weight: 850;
      cursor: pointer;
    }
    .footer-action.primary {
      border-color: rgba(126,234,255,.42);
      background: rgba(126,234,255,.10);
      color: #e9fbff;
    }

    .evidence-drawer {
      position: absolute;
      inset: auto 18px calc(82px + env(safe-area-inset-bottom));
      max-height: 54%;
      z-index: 26;
      padding: 17px 15px 15px;
      border-radius: 22px;
      background: linear-gradient(145deg, rgba(255,255,255,.16), rgba(255,255,255,.06)), rgba(5,10,16,.86);
      border: 1px solid rgba(255,255,255,.24);
      box-shadow: 0 22px 48px rgba(0,0,0,.42);
      backdrop-filter: blur(20px) saturate(1.2);
      opacity: 0;
      transform: translateY(16px);
      pointer-events: none;
      transition: opacity 220ms ease, transform 220ms ease;
    }
    .evidence-drawer.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
    .drawer-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }
    .drawer-title {
      color: var(--cyan);
      font-size: 14px;
      font-weight: 900;
    }
    .drawer-close {
      width: 34px;
      height: 30px;
      border: 1px solid rgba(255,255,255,.20);
      border-radius: 999px;
      background: rgba(255,255,255,.08);
      color: var(--ink);
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
    }
    .evidence-list {
      display: grid;
      gap: 9px;
      max-height: 320px;
      overflow: auto;
      padding-right: 2px;
    }
    .evidence-item {
      padding: 11px 12px;
      border-radius: 14px;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.15);
    }
    .evidence-source {
      color: rgba(247,251,255,.58);
      font-size: 11px;
      font-weight: 800;
      margin-bottom: 5px;
    }
    .evidence-text {
      color: rgba(247,251,255,.90);
      font-size: 13px;
      font-weight: 760;
      line-height: 1.42;
      word-break: keep-all;
    }
    .evidence-empty {
      color: rgba(247,251,255,.58);
      font-size: 13px;
      font-weight: 680;
      line-height: 1.45;
    }

    .toast {
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: calc(18px + env(safe-area-inset-bottom));
      z-index: 30;
      min-height: 118px;
      padding: 16px 16px 15px;
      border-radius: 20px;
      background: rgba(4,10,16,.76);
      border: 1px solid rgba(255,255,255,.24);
      box-shadow: 0 20px 42px rgba(0,0,0,.38), inset 0 1px 0 rgba(255,255,255,.14);
      backdrop-filter: blur(18px) saturate(1.2);
      opacity: 0;
      transform: translateY(18px);
      pointer-events: none;
      transition: opacity 240ms ease, transform 240ms ease;
    }
    .toast.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
    .toast-name {
      color: var(--cyan);
      font-size: 13px;
      font-weight: 900;
      margin-bottom: 8px;
    }
    .toast-line {
      min-height: 54px;
      font-size: clamp(16px, 4.35vw, 20px);
      font-weight: 740;
      line-height: 1.46;
      word-break: keep-all;
    }
    .toast-next {
      position: absolute;
      right: 18px;
      bottom: 13px;
      width: 10px;
      height: 10px;
      border-right: 2px solid rgba(126,234,255,.78);
      border-bottom: 2px solid rgba(126,234,255,.78);
      transform: rotate(45deg);
    }

    .dim {
      position: absolute;
      inset: 0;
      z-index: 21;
      background: rgba(0,0,0,.54);
      opacity: 0;
      pointer-events: none;
      transition: opacity 240ms ease;
    }
    .dim.show { opacity: 1; pointer-events: auto; }

    .minseo-cutin {
      position: absolute;
      left: 50%;
      bottom: 124px;
      width: min(48vw, 220px);
      aspect-ratio: 330 / 793;
      z-index: 24;
      background-image: url("../../assets/images/characters/han-minseo/expression-sheet-knee-up-transparent-v3.png");
      background-repeat: no-repeat;
      background-size: 600% 100%;
      background-position: 60% 0%;
      filter: drop-shadow(0 28px 26px rgba(0,0,0,.52));
      opacity: 0;
      transform: translateX(-50%) translateY(18px);
      pointer-events: none;
      transition: opacity 260ms ease, transform 320ms cubic-bezier(.18,.84,.26,1);
    }
    .minseo-cutin.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .record-viewer {
      position: absolute;
      inset: 0;
      z-index: 18;
      background:
        radial-gradient(circle at 50% 7%, rgba(126,234,255,.10), transparent 34%),
        linear-gradient(180deg, #071019, #03070c 74%);
      opacity: 0;
      pointer-events: none;
      transform: translateY(18px);
      transition: opacity 220ms ease, transform 260ms ease;
    }
    .phone:has(.record-viewer.show) .topbar { opacity: 0; }
    .record-viewer.show { opacity: 1; pointer-events: auto; transform: translateY(0); }
    .record-header {
      position: absolute;
      top: calc(58px + env(safe-area-inset-top));
      left: 18px;
      right: 18px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .back-button, .page-button, .judge-button {
      border: 1px solid rgba(255,255,255,.22);
      background: rgba(255,255,255,.08);
      color: var(--ink);
      border-radius: 999px;
      backdrop-filter: blur(14px);
      font-family: inherit;
      font-weight: 820;
      cursor: pointer;
    }
    .back-button { width: 42px; height: 36px; font-size: 18px; }
    .record-title {
      flex: 1;
      min-width: 0;
      font-size: 14px;
      font-weight: 900;
      color: rgba(247,251,255,.86);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: center;
    }
    .record-count {
      min-width: 42px;
      text-align: right;
      color: rgba(247,251,255,.58);
      font-size: 12px;
      font-weight: 800;
    }
    .record-status {
      position: absolute;
      right: 18px;
      top: calc(104px + env(safe-area-inset-top));
      z-index: 30;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 28px;
      padding: 0 10px;
      border-radius: 999px;
      background: rgba(33, 156, 111, .20);
      border: 1px solid rgba(95, 226, 173, .44);
      color: rgba(214, 255, 238, .96);
      box-shadow: 0 10px 22px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.12);
      backdrop-filter: blur(12px);
      font-size: 12px;
      font-weight: 900;
      opacity: 0;
      transform: translateY(-4px);
      pointer-events: none;
      transition: opacity 160ms ease, transform 160ms ease;
    }
    .record-status.show { opacity: 1; transform: translateY(0); }
    .record-status::before {
      content: "";
      width: 13px;
      height: 13px;
      border-radius: 4px;
      background: #5fe2ad;
      box-shadow: inset 0 0 0 2px rgba(5,20,15,.30);
    }
    .record-image-wrap {
      position: absolute;
      left: 18px;
      right: 18px;
      top: calc(112px + env(safe-area-inset-top));
      bottom: calc(142px + env(safe-area-inset-bottom));
      display: grid;
      place-items: center;
    }
    .record-image {
      width: min(100%, 390px);
      max-height: 100%;
      object-fit: contain;
      border-radius: 24px;
      box-shadow: 0 24px 58px rgba(0,0,0,.46);
    }
    .record-actions {
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: calc(22px + env(safe-area-inset-bottom));
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .side-pocket {
      position: absolute;
      right: 0;
      top: 46%;
      z-index: 29;
      display: grid;
      gap: 9px;
      transform: translateY(-50%);
    }
    .pocket-button {
      width: 46px;
      height: 50px;
      border: 1px solid rgba(255,255,255,.22);
      border-right: 0;
      border-radius: 15px 0 0 15px;
      background: linear-gradient(145deg, rgba(255,255,255,.15), rgba(255,255,255,.06)), rgba(5,12,18,.74);
      color: rgba(247,251,255,.90);
      box-shadow: 0 14px 28px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.12);
      backdrop-filter: blur(16px) saturate(1.2);
      display: grid;
      place-items: center;
      cursor: pointer;
    }
    .pocket-button svg {
      width: 22px;
      height: 22px;
      stroke: currentColor;
      stroke-width: 2.2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .pocket-button:active { transform: translateX(1px); }

    .judge-button {
      min-height: 52px;
      border-radius: 17px;
      font-size: 15px;
      background: linear-gradient(145deg, rgba(255,255,255,.13), rgba(255,255,255,.055));
      box-shadow: 0 12px 25px rgba(0,0,0,.24), inset 0 1px 0 rgba(255,255,255,.10);
    }
    .judge-button.primary { border-color: rgba(126,234,255,.34); }
    .judge-button.recorded {
      border-color: rgba(95,226,173,.46);
      color: rgba(214,255,238,.96);
      background: linear-gradient(145deg, rgba(95,226,173,.18), rgba(255,255,255,.055));
    }

    .fail-card {
      position: absolute;
      inset: auto 22px calc(24px + env(safe-area-inset-bottom));
      z-index: 32;
      padding: 22px 18px 18px;
      border-radius: 24px;
      background: linear-gradient(145deg, rgba(255,255,255,.16), rgba(255,255,255,.06)), rgba(5,10,16,.86);
      border: 1px solid rgba(255,255,255,.26);
      box-shadow: 0 22px 48px rgba(0,0,0,.44);
      backdrop-filter: blur(20px) saturate(1.2);
      opacity: 0;
      transform: translateY(16px);
      pointer-events: none;
      transition: opacity 240ms ease, transform 240ms ease;
    }
    .fail-card.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
    .fail-title {
      color: #ff8f9b;
      font-size: 18px;
      font-weight: 900;
      margin-bottom: 10px;
    }
    .fail-body {
      color: rgba(247,251,255,.86);
      font-size: 15px;
      line-height: 1.48;
      font-weight: 680;
      margin-bottom: 16px;
    }
    .fail-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .fail-actions button {
      min-height: 44px;
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 14px;
      background: rgba(255,255,255,.10);
      color: var(--ink);
      font-size: 14px;
      font-weight: 820;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main class="phone" aria-label="Episode 1 LMS investigation menu mockup">
    <div class="monitor-area"></div>
    <div class="topbar">
      <div class="pill">EP.01 FIRST LOGIN</div>
      <div class="pill">조사 모드</div>
    </div>

    <section class="menu-panel">
      <div class="menu-title">
        <div>
          <div class="kicker">LMS 활동 조회</div>
          <h1>어디부터 확인해볼까?</h1>
        </div>
        <div class="target"></div>
      </div>
      <p class="prompt">민서가 말한 계정 이상과 관련된 기록만 확인하자.</p>
      <div class="grid">
        <button class="menu-card sensitive" type="button" data-label="학부성적기록">
          <span class="card-title">학부성적기록</span>
          <span class="card-sub"></span>
        </button>
        <button class="menu-card sensitive" type="button" data-label="출석기록">
          <span class="card-title">출석기록</span>
          <span class="card-sub"></span>
        </button>
        <button class="menu-card valid" type="button" data-target="homepage-access">
          <span class="card-title">홈페이지 접속 기록</span>
          <span class="card-sub"></span>
        </button>
        <button class="menu-card valid" type="button" data-target="homepage-activity">
          <span class="card-title">홈페이지 활동 기록</span>
          <span class="card-sub"></span>
        </button>
        <button class="menu-card valid" type="button" data-target="browser-history">
          <span class="card-title">브라우저 기록</span>
          <span class="card-sub"></span>
        </button>
        <button class="menu-card valid" type="button" data-target="pc-info">
          <span class="card-title">PC 정보</span>
          <span class="card-sub"></span>
        </button>
      </div>
    </section>

    <div class="investigation-footer" id="investigationFooter">
      <button class="footer-action" type="button" id="evidenceOpen">증거 카드 보기</button>
      <button class="footer-action primary" type="button" id="finishInvestigation">조사 완료</button>
    </div>
    <section class="evidence-drawer" id="evidenceDrawer" aria-label="증거 카드">
      <div class="drawer-head">
        <div class="drawer-title">증거 카드</div>
        <button class="drawer-close" type="button" id="evidenceClose" aria-label="닫기">×</button>
      </div>
      <div class="evidence-list" id="evidenceList"></div>
    </section>

    <section class="record-viewer" id="recordViewer" aria-label="조사 기록 화면">
      <div class="record-header">
        <button class="back-button" type="button" id="recordBack" aria-label="돌아가기">‹</button>
        <div class="record-title" id="recordTitle">기록 조회</div>
        <div class="record-count" id="recordCount">1/1</div>
      </div>
      <div class="record-status" id="recordStatus">기록됨</div>
      <div class="record-image-wrap">
        <img class="record-image" id="recordImage" alt="조사 기록 화면" />
      </div>
      <div class="side-pocket" aria-label="조사 보조 도구">
        <button class="pocket-button" type="button" id="recordEvidenceOpen" aria-label="증거 카드 보기">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h8l4 4v14H7z"/><path d="M15 3v5h4"/><path d="M10 13h6"/><path d="M10 17h5"/></svg>
        </button>
        <button class="pocket-button" type="button" id="hintButton" aria-label="힌트 보기">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M8.5 14.5c-1.4-1-2.3-2.6-2.3-4.4A5.8 5.8 0 0 1 12 4.3a5.8 5.8 0 0 1 5.8 5.8c0 1.8-.9 3.4-2.3 4.4-.8.6-1.2 1.2-1.3 2H9.8c-.1-.8-.5-1.4-1.3-2z"/></svg>
        </button>
      </div>
      <div class="record-actions">
        <button class="judge-button primary" type="button" id="recordKeep">증거로 기록한다</button>
        <button class="judge-button" type="button" id="recordSkip">관련 없어 보인다</button>
      </div>
    </section>

    <div class="dim" id="dim"></div>
    <div class="minseo-cutin" id="minseoCutin"></div>
    <div class="toast" id="toast">
      <div class="toast-name" id="toastName">한민서</div>
      <div class="toast-line" id="toastLine"></div>
      <div class="toast-next"></div>
    </div>
    <section class="fail-card" id="failCard">
      <div class="fail-title">미션 실패</div>
      <div class="fail-body">의뢰 범위를 벗어난 개인정보에 반복 접근했습니다.</div>
      <div class="fail-actions">
        <button type="button" id="retryBtn">다시 시도</button>
        <button type="button">메인으로</button>
      </div>
    </section>
  </main>

  <script src="../shared-audio.js"></script>
  <script>
    window.HLTAudio.init({
      bgm: '../../assets/audio/mobile/episode-01/bgm-investigation.mp3',
      bgmVolume: 0.29,
      sfx: {
        click: '../../assets/audio/mobile/common/sfx-click.mp3',
        card: '../../assets/audio/mobile/common/sfx-card.mp3'
      }
    });

    const dim = document.getElementById('dim');
    const toast = document.getElementById('toast');
    const toastName = document.getElementById('toastName');
    const toastLine = document.getElementById('toastLine');
    const minseoCutin = document.getElementById('minseoCutin');
    const failCard = document.getElementById('failCard');
    const investigationFooter = document.getElementById('investigationFooter');
    const evidenceOpen = document.getElementById('evidenceOpen');
    const finishInvestigation = document.getElementById('finishInvestigation');
    const evidenceDrawer = document.getElementById('evidenceDrawer');
    const evidenceClose = document.getElementById('evidenceClose');
    const evidenceList = document.getElementById('evidenceList');
    const recordViewer = document.getElementById('recordViewer');
    const recordTitle = document.getElementById('recordTitle');
    const recordCount = document.getElementById('recordCount');
    const recordImage = document.getElementById('recordImage');
    const recordKeep = document.getElementById('recordKeep');
    const recordSkip = document.getElementById('recordSkip');
    const recordBack = document.getElementById('recordBack');
    const recordStatus = document.getElementById('recordStatus');
    const recordEvidenceOpen = document.getElementById('recordEvidenceOpen');
    const hintButton = document.getElementById('hintButton');
    let sensitiveCount = 0;
    let toastStep = 0;
    let toastLines = [];
    let pendingFailure = false;
    let recordQueue = [];
    let recordIndex = 0;
    let firstEvidenceMessageShown = false;
    const collectedEvidence = new Map();

    const recordSets = {
      'pc-info': [
        { title: 'PC 정보', file: '../../assets/images/mobile/investigation/episode-01/photo-evidence-v1/ep01-pc-info-cmd-v2.png' }
      ],
      'homepage-access': [
        { title: '홈페이지 접속 기록', file: '../../assets/images/mobile/investigation/episode-01/photo-evidence-v1/ep01-homepage-access-01-v2.png' },
        { title: '홈페이지 접속 기록', file: '../../assets/images/mobile/investigation/episode-01/photo-evidence-v1/ep01-homepage-access-02-v2.png' }
      ],
      'homepage-activity': [
        { title: '홈페이지 활동 기록', file: '../../assets/images/mobile/investigation/episode-01/photo-evidence-v1/ep01-homepage-activity-01-v2.png' },
        { title: '홈페이지 활동 기록', file: '../../assets/images/mobile/investigation/episode-01/photo-evidence-v1/ep01-homepage-activity-02-v2.png' }
      ],
      'browser-history': [
        { title: '브라우저 기록', file: '../../assets/images/mobile/investigation/episode-01/photo-evidence-v1/ep01-browser-history-01-v2.png' },
        { title: '브라우저 기록', file: '../../assets/images/mobile/investigation/episode-01/photo-evidence-v1/ep01-browser-history-02-v2.png' }
      ]
    };

    const evidenceMeta = {
      'ep01-pc-info-cmd-v2.png': { source: 'PC 정보', text: '현재 실습실 PC의 호스트명이 LAB-PC-14로 확인된다.' },
      'ep01-homepage-access-01-v2.png': { source: '홈페이지 접속 기록', text: '최근 접속 구간에 로그인 실패와 로그인 페이지 접근 기록이 보인다.' },
      'ep01-homepage-access-02-v2.png': { source: '홈페이지 접속 기록', text: '전날 LAB-PC-14에서 민서 계정 사용 후 명확한 로그아웃 기록이 없다.' },
      'ep01-homepage-activity-01-v2.png': { source: '홈페이지 활동 기록', text: '일반 공지와 강의 페이지 조회 기록이 이어진다.' },
      'ep01-homepage-activity-02-v2.png': { source: '홈페이지 활동 기록', text: '계정 설정과 비밀번호 변경 요청 관련 활동이 남아 있다.' },
      'ep01-browser-history-01-v2.png': { source: '브라우저 기록', text: '오늘 오전 LMS 로그인 페이지와 도움말 페이지 방문 기록이 있다.' },
      'ep01-browser-history-02-v2.png': { source: '브라우저 기록', text: '브라우저 복원으로 민서 계정 세션이 다시 열린 기록이 있다.' }
    };

    const legacyEvidenceIds = {
      'ep01-pc-info-cmd-v1.svg': 'ep01-pc-info-cmd-v2.png',
      'ep01-homepage-access-01-v1.svg': 'ep01-homepage-access-01-v2.png',
      'ep01-homepage-access-02-v1.svg': 'ep01-homepage-access-02-v2.png',
      'ep01-homepage-activity-01-v1.svg': 'ep01-homepage-activity-01-v2.png',
      'ep01-homepage-activity-02-v1.svg': 'ep01-homepage-activity-02-v2.png',
      'ep01-browser-history-01-v1.svg': 'ep01-browser-history-01-v2.png',
      'ep01-browser-history-02-v1.svg': 'ep01-browser-history-02-v2.png'
    };

    function normalizeEvidenceId(id) {
      return legacyEvidenceIds[id] || id;
    }

    function saveEvidenceState() {
      sessionStorage.setItem('ep01Evidence', JSON.stringify([...collectedEvidence.keys()]));
    }

    function loadEvidenceState() {
      const saved = JSON.parse(sessionStorage.getItem('ep01Evidence') || '[]').map(normalizeEvidenceId);
      saved.forEach(id => {
        if (evidenceMeta[id]) collectedEvidence.set(id, evidenceMeta[id]);
      });
      sessionStorage.setItem('ep01Evidence', JSON.stringify([...collectedEvidence.keys()]));
      if (collectedEvidence.size) {
        firstEvidenceMessageShown = true;
        showInvestigationFooter();
      }
      renderEvidenceList();
    }

    function currentRecordId() {
      const current = recordQueue[recordIndex];
      if (!current) return '';
      return current.file.split('/').pop();
    }

    function renderEvidenceList() {
      evidenceList.innerHTML = '';
      if (!collectedEvidence.size) {
        const empty = document.createElement('div');
        empty.className = 'evidence-empty';
        empty.textContent = '아직 기록한 증거가 없다.';
        evidenceList.appendChild(empty);
        return;
      }
      collectedEvidence.forEach(item => {
        const node = document.createElement('div');
        node.className = 'evidence-item';
        const source = document.createElement('div');
        source.className = 'evidence-source';
        source.textContent = item.source;
        const text = document.createElement('div');
        text.className = 'evidence-text';
        text.textContent = item.text;
        node.append(source, text);
        evidenceList.appendChild(node);
      });
    }

    function showInvestigationFooter() {
      investigationFooter.classList.add('show');
    }

    function collectCurrentRecord() {
      window.HLTAudio.play('card');
      const id = currentRecordId();
      const meta = evidenceMeta[id];
      if (meta) collectedEvidence.set(id, meta);
      saveEvidenceState();
      showInvestigationFooter();
      renderEvidenceList();
      if (!firstEvidenceMessageShown) {
        firstEvidenceMessageShown = true;
        showToast('강지호', ['증거 카드가 생성되었다. 필요하면 수집한 내용을 다시 확인할 수 있다.'], false);
      }
    }

    function normalizeLine(line, defaultName) {
      if (typeof line === 'string') return { name: defaultName, text: line };
      return line;
    }

    function renderToastLine() {
      const current = normalizeLine(toastLines[toastStep], toastName.textContent || '강지호');
      toastName.textContent = current.name;
      toastLine.textContent = current.text;
    }

    function showToast(name, lines, withMinseo = false, failAfter = false) {
      toastLines = lines.map(line => normalizeLine(line, name));
      toastStep = 0;
      pendingFailure = failAfter;
      renderToastLine();
      toast.classList.add('show');
      dim.classList.toggle('show', withMinseo);
      minseoCutin.classList.toggle('show', withMinseo);
    }

    function hideToast() {
      toast.classList.remove('show');
      dim.classList.remove('show');
      minseoCutin.classList.remove('show');
    }

    function failMission() {
      showToast('한민서', [
        { name: '한민서', text: '지호야, 진짜 뭐 하는 거야?' },
        { name: '한민서', text: '내가 봐달라고 한 건 계정이 이상한 이유지, 내 개인정보가 아니잖아.' },
        { name: '강지호', text: '...미안. 내가 선을 넘었어.' },
        { name: '한민서', text: '이건 도와주는 게 아니라, 그냥 내 기록을 뒤지는 거야.' }
      ], true, true);
    }

    toast.addEventListener('click', () => {
      if (toastStep < toastLines.length - 1) {
        toastStep += 1;
        renderToastLine();
        return;
      }
      const shouldFail = pendingFailure;
      hideToast();
      pendingFailure = false;
      if (shouldFail) {
        dim.classList.add('show');
        failCard.classList.add('show');
      }
    });

    document.querySelectorAll('.sensitive').forEach(button => {
      button.addEventListener('click', () => {
        sensitiveCount += 1;
        const label = button.dataset.label;
        if (sensitiveCount === 1) {
          if (label === '학부성적기록') {
            showToast('한민서', [
              { name: '한민서', text: '야! 거길 왜 봐?' },
              { name: '강지호', text: '아, 미안. 이건 지금 일이랑 상관없는 정보지.' },
              { name: '한민서', text: '내가 봐달라고 한 건 이상한 접속 기록이야. 성적표가 아니라.' },
              { name: '강지호', text: '응, 알았어. 다른 접속 기록 확인할게.' }
            ], true);
          } else {
            showToast('한민서', [
              { name: '한민서', text: '잠깐, 그건 왜 열어?' },
              { name: '강지호', text: '맞다. 출석 정보도 개인 기록이지. 지금 볼 건 아니네.' },
              { name: '한민서', text: '나 계정이 이상한 것 같다고 했지, 출석 확인해달라고 한 건 아니잖아.' },
              { name: '강지호', text: '미안. 접속 기록 쪽으로 볼게.' }
            ], true);
          }
          return;
        }
        failMission();
      });
    });

    function isCurrentRecordCollected() {
      const id = currentRecordId();
      return id && collectedEvidence.has(id);
    }

    function removeCurrentRecordEvidence() {
      const id = currentRecordId();
      if (id && collectedEvidence.has(id)) {
        collectedEvidence.delete(id);
        saveEvidenceState();
        renderEvidenceList();
      }
    }

    function renderRecord() {
      const current = recordQueue[recordIndex];
      if (!current) return;
      recordTitle.textContent = current.title;
      recordCount.textContent = `${recordIndex + 1}/${recordQueue.length}`;
      recordImage.src = current.file;
      const isPcInfo = recordQueue.length === 1 && current.title === 'PC 정보';
      const collected = isCurrentRecordCollected();
      recordStatus.classList.toggle('show', collected);
      recordKeep.classList.toggle('recorded', collected);
      if (isPcInfo) {
        recordKeep.textContent = collected ? '확인됨' : '확인했다';
        recordSkip.textContent = '돌아간다';
      } else {
        recordKeep.textContent = collected ? '기록됨' : '증거로 기록한다';
        recordSkip.textContent = collected ? '증거에서 제외한다' : '관련 없어 보인다';
      }
    }

    function openRecordSet(key) {
      recordQueue = recordSets[key] || [];
      recordIndex = 0;
      renderRecord();
      recordViewer.classList.add('show');
    }

    function closeRecordSet() {
      recordViewer.classList.remove('show');
      recordQueue = [];
      recordIndex = 0;
      recordImage.removeAttribute('src');
      recordStatus.classList.remove('show');
      recordKeep.classList.remove('recorded');
    }

    function advanceRecord() {
      if (recordIndex < recordQueue.length - 1) {
        recordIndex += 1;
        renderRecord();
        return;
      }
      closeRecordSet();
    }

    recordKeep.addEventListener('click', () => {
      if (!isCurrentRecordCollected()) collectCurrentRecord();
      advanceRecord();
    });
    recordSkip.addEventListener('click', () => {
      removeCurrentRecordEvidence();
      advanceRecord();
    });
    recordBack.addEventListener('click', closeRecordSet);
    evidenceOpen.addEventListener('click', () => {
      renderEvidenceList();
      evidenceDrawer.classList.add('show');
    });
    recordEvidenceOpen.addEventListener('click', () => {
      renderEvidenceList();
      evidenceDrawer.classList.add('show');
    });
    hintButton.addEventListener('click', () => {
      showToast('강지호', ['아직은 누군가에게 물어볼 만한 단서가 부족하다. 내가 먼저 기록을 더 확인해보자.'], false);
    });
    evidenceClose.addEventListener('click', () => evidenceDrawer.classList.remove('show'));
    finishInvestigation.addEventListener('click', () => {
      saveEvidenceState();
      if (!collectedEvidence.size) {
        showToast('강지호', ['아직 기록한 증거가 없다. 최소한 근거가 될 만한 기록은 남겨야 한다.'], false);
        return;
      }
      window.location.href = '../episode-01-conclusion/index.html';
    });

    document.querySelectorAll('.valid').forEach(button => {
      button.addEventListener('click', () => {
        openRecordSet(button.dataset.target);
      });
    });

    document.getElementById('retryBtn').addEventListener('click', () => {
      sensitiveCount = 0;
      failCard.classList.remove('show');
      dim.classList.remove('show');
    });

    loadEvidenceState();
  </script>
</body>
</html>
