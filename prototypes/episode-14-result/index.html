:root{--phone-w:min(100vw,430px);--phone-h:min(100dvh,932px);--ink:#f7fbff;--cyan:#7eeaff;--red:#ff8f9b;--green:#5fe2ad;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif}*{box-sizing:border-box}html,body{height:100%}body{margin:0;display:grid;place-items:center;overflow:hidden;color:var(--ink);background:radial-gradient(circle at 50% 8%,rgba(126,234,255,.14),transparent 34%),linear-gradient(160deg,#020409,#07131d 54%,#020409)}.phone{position:relative;width:var(--phone-w);height:var(--phone-h);max-height:932px;aspect-ratio:9/16;overflow:hidden;background:#05080d;box-shadow:0 28px 80px rgba(0,0,0,.62);isolation:isolate}.bg{position:absolute;inset:0;background-image:linear-gradient(to bottom,rgba(0,0,0,.16),rgba(0,0,0,.78)),url("../../assets/images/mobile/backgrounds/mob-bg-forensic-lab-v1.png");background-size:cover;background-position:center;filter:saturate(.88) brightness(.62);transform:scale(1.03)}.topbar{position:absolute;top:calc(14px + env(safe-area-inset-top));left:16px;right:16px;display:flex;justify-content:space-between;gap:10px;z-index:8}.pill{padding:8px 12px;border-radius:999px;background:rgba(4,10,16,.48);border:1px solid rgba(255,255,255,.20);color:rgba(247,251,255,.82);backdrop-filter:blur(12px);font-size:12px;font-weight:850;letter-spacing:.05em;white-space:nowrap}.result{position:absolute;inset:calc(68px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom));z-index:12;display:flex;flex-direction:column;gap:10px;min-height:0}.result-card{padding:15px 14px;border-radius:22px;background:linear-gradient(145deg,rgba(255,255,255,.16),rgba(255,255,255,.06)),rgba(5,10,16,.82);border:1px solid rgba(255,255,255,.24);box-shadow:0 20px 44px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.12);backdrop-filter:blur(20px) saturate(1.15)}.status{font-size:13px;font-weight:950;letter-spacing:.08em;margin-bottom:8px}.success{color:var(--green)}.fail{color:var(--red)}h1{margin:0;font-size:clamp(21px,5.6vw,28px);line-height:1.22;font-weight:930;word-break:keep-all}.section-title{color:var(--cyan);font-size:13px;font-weight:900;margin:2px 0 8px}.list{display:grid;gap:8px;overflow-y:auto;padding-right:3px;overscroll-behavior:contain;max-height:430px}.item{padding:10px 11px;border-radius:14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:rgba(247,251,255,.88);font-size:13px;font-weight:720;line-height:1.42;word-break:keep-all}.actions{margin-top:auto;display:grid;grid-template-columns:1fr 1fr;gap:10px}.action{min-height:50px;border:1px solid rgba(255,255,255,.20);border-radius:16px;background:rgba(255,255,255,.07);color:var(--ink);font-family:inherit;font-size:14px;font-weight:850;cursor:pointer}.action.primary{border-color:rgba(126,234,255,.42);background:rgba(126,234,255,.11)}.stamp{position:absolute;left:50%;top:43%;z-index:40;width:min(82vw,350px);height:auto;transform:translate(-50%,-50%) rotate(-37deg) scale(2.1);opacity:0;pointer-events:none;filter:drop-shadow(0 22px 26px rgba(0,0,0,.38));mix-blend-mode:screen}.stamp.show{animation:stampHit 2600ms cubic-bezier(.18,.84,.26,1) forwards}@keyframes stampHit{0%{opacity:0;transform:translate(-50%,-50%) rotate(-37deg) scale(2.1);filter:blur(2px) drop-shadow(0 22px 26px rgba(0,0,0,.38))}13%{opacity:1;transform:translate(-50%,-50%) rotate(-37deg) scale(.92);filter:blur(0) drop-shadow(0 22px 26px rgba(0,0,0,.38))}19%{transform:translate(-50%,-50%) rotate(-34deg) scale(1.03)}24%{transform:translate(-50%,-50%) rotate(-39deg) scale(.99)}31%{transform:translate(-50%,-50%) rotate(-37deg) scale(1)}72%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) rotate(-37deg) scale(1.04)}}

const traps=["ep14-env-real-pc-run-04-trap.png", "ep14-peview-version-info-04-trap.png", "ep14-ida-hexrays-generic-strings-04-trap.png", "ep14-ghidra-generic-init-04-trap.png", "ep14-x64dbg-runtime-init-04-trap.png", "ep14-sysinternals-normal-activity-04-trap.png"];
const evidenceMeta={"ep14-env-vm-snapshot-01-true.png": {"source": "환경설정", "text": "VM 스냅샷 생성이 확인된다.", "kind": "true"}, "ep14-env-isolated-network-02-true.png": {"source": "환경설정", "text": "분석 VM 네트워크가 격리되어 있다.", "kind": "true"}, "ep14-env-hash-match-03-true.png": {"source": "환경설정", "text": "EP13 포렌식 샘플 해시와 현재 분석 샘플 해시가 일치한다.", "kind": "true"}, "ep14-env-real-pc-run-04-trap.png": {"source": "환경설정", "text": "실제 PC에서 샘플을 실행하려는 위험한 절차다.", "kind": "trap"}, "ep14-peview-high-entropy-section-01-true.png": {"source": "PEview", "text": "높은 엔트로피와 비정상 섹션 권한이 보인다.", "kind": "true"}, "ep14-peview-suspicious-imports-02-true.png": {"source": "PEview", "text": "파일/레지스트리/네트워크 관련 Import가 함께 보인다.", "kind": "true"}, "ep14-peview-entrypoint-section-03-true.png": {"source": "PEview", "text": "EntryPoint와 섹션 구조가 정상 앱과 다르게 보인다.", "kind": "true"}, "ep14-peview-version-info-04-trap.png": {"source": "PEview", "text": "버전/아이콘 정보만으로 행위를 판단하기 어렵다.", "kind": "trap"}, "ep14-ida-hexrays-browser-pref-write-01-true.png": {"source": "IDA Pro / Hex-Rays", "text": "브라우저 Preferences 경로와 쓰기 흐름이 보인다.", "kind": "true"}, "ep14-ida-hexrays-note-sync-url-02-true.png": {"source": "IDA Pro / Hex-Rays", "text": "note-sync 계열 URL을 시작 페이지 값으로 구성하는 흐름이 보인다.", "kind": "true"}, "ep14-ida-hexrays-admin-url-xrefs-03-true.png": {"source": "IDA Pro / Hex-Rays", "text": "내부 관리자 페이지 문자열과 설정 루틴의 교차 참조가 보인다.", "kind": "true"}, "ep14-ida-hexrays-generic-strings-04-trap.png": {"source": "IDA Pro / Hex-Rays", "text": "일반 문자열/로그 흐름만으로 설정 변경을 입증하기 어렵다.", "kind": "trap"}, "ep14-ghidra-config-path-01-true.png": {"source": "Ghidra", "text": "설정 경로와 키 조립 함수 흐름이 보인다.", "kind": "true"}, "ep14-ghidra-note-sync-uri-02-true.png": {"source": "Ghidra", "text": "note-sync URI 패턴 생성 흐름이 보인다.", "kind": "true"}, "ep14-ghidra-persistence-registry-03-true.png": {"source": "Ghidra", "text": "자동실행 지속성 확보에 쓰이는 레지스트리 흐름이 보인다.", "kind": "true"}, "ep14-ghidra-generic-init-04-trap.png": {"source": "Ghidra", "text": "일반 초기화 함수만으로 사건 행위를 설명하기 어렵다.", "kind": "trap"}, "ep14-x64dbg-writefile-breakpoint-01-true.png": {"source": "x64dbg", "text": "런타임에서 브라우저 설정 파일 쓰기 인자가 확인된다.", "kind": "true"}, "ep14-x64dbg-network-connect-02-true.png": {"source": "x64dbg", "text": "런타임에서 note-sync 계열 연결 인자가 확인된다.", "kind": "true"}, "ep14-x64dbg-registry-run-03-true.png": {"source": "x64dbg", "text": "런타임에서 Run 키 등록 인자가 확인된다.", "kind": "true"}, "ep14-x64dbg-runtime-init-04-trap.png": {"source": "x64dbg", "text": "일반 런타임 초기화 지점만으로 악성 행위를 설명하기 어렵다.", "kind": "trap"}, "ep14-sysinternals-procmon-file-browser-01-true.png": {"source": "Sysinternals Suite", "text": "Procmon에서 브라우저 설정 파일 변경 흐름이 관찰된다.", "kind": "true"}, "ep14-sysinternals-autoruns-runkey-02-true.png": {"source": "Sysinternals Suite", "text": "Autoruns에서 자동실행 등록이 관찰된다.", "kind": "true"}, "ep14-sysinternals-tcpview-process-03-true.png": {"source": "Sysinternals Suite", "text": "TCPView/Process Explorer에서 의심 프로세스 연결 흐름이 관찰된다.", "kind": "true"}, "ep14-sysinternals-normal-activity-04-trap.png": {"source": "Sysinternals Suite", "text": "정상 시스템 활동만으로 샘플 행위를 설명하기 어렵다.", "kind": "trap"}};
const categoryRequired={}; required.forEach(id=>{ const c=evidenceMeta[id].source; categoryRequired[c]=(categoryRequired[c]||0)+1; });
const collected=JSON.parse(sessionStorage.getItem('ep14Evidence') || '[]').filter(id=>evidenceMeta[id]);
const has=id=>collected.includes(id); const missing=required.filter(id=>!has(id)); const trapHits=traps.filter(id=>has(id)); const isSuccess=missing.length===0 && trapHits.length===0;
const modePill=document.getElementById('modePill'), statusText=document.getElementById('statusText'), headline=document.getElementById('headline'), detailTitle=document.getElementById('detailTitle'), detailList=document.getElementById('detailList'), actions=document.getElementById('actions'), stamp=document.getElementById('stamp');
function renderList(items){ detailList.innerHTML=''; items.forEach(text=>{ const div=document.createElement('div'); div.className='item'; div.textContent=text; detailList.appendChild(div); }); }
function playStamp(success){ window.HLTAudio.play('stamp'); stamp.src=success?'../../assets/images/mobile/ui/result-stamp-success-v1.png':'../../assets/images/mobile/ui/result-stamp-failed-v1.png'; stamp.className='stamp'; void stamp.offsetWidth; stamp.classList.add('show'); }
function missingByCategory(){ const found={}; collected.forEach(id=>{ const item=evidenceMeta[id]; if(item && item.kind==='true') found[item.source]=(found[item.source]||0)+1; }); return Object.keys(categoryRequired).filter(c=>(found[c]||0)<categoryRequired[c]).map(c=>`${c}: ${found[c]||0}/${categoryRequired[c]}`); }
if(isSuccess){ modePill.textContent='CLEAR'; statusText.textContent='ANALYSIS SUCCESS'; statusText.className='status success'; headline.textContent='샘플의 행위가 사건과 연결됐다.'; detailTitle.textContent='확인된 분석 흐름'; renderList(['안전한 VM 환경과 샘플 해시 일치가 확인됐다.','PE 구조와 Import에서 파일/레지스트리/네트워크 행위 가능성이 보였다.','IDA Pro와 Ghidra 정적 분석에서 브라우저 설정, note-sync URI, 지속성 흐름이 연결됐다.','x64dbg와 Sysinternals 동적 관찰에서 설정 파일 변경, Run 키 등록, 네트워크 연결이 재현됐다.']); actions.innerHTML='<button class="action" id="review">자료 다시 보기</button><button class="action primary" id="next">사건 정리</button>'; document.getElementById('review').addEventListener('click',()=>window.location.href='../episode-14-investigation-menu/index.html'); document.getElementById('next').addEventListener('click',()=>window.location.href='../episode-14-ending-comic-animation/index.html'); playStamp(true); }
else { modePill.textContent='FAILED'; statusText.textContent='ANALYSIS FAILED'; statusText.className='status fail'; headline.textContent='분석 근거를 다시 골라야 한다.'; detailTitle.textContent='부족한 부분'; const details=[]; if(!collected.length) details.push('선택한 분석 화면이 없다.'); missingByCategory().forEach(text=>details.push('필요한 증거가 부족하다: '+text)); if(trapHits.length) details.push('사건 행위를 설명하지 못하거나 절차상 위험한 화면이 증거 카드에 섞였다.'); renderList(details.length?details:['증거 카드의 정적 분석과 동적 관찰 연결이 부족하다.']); actions.innerHTML='<button class="action" id="review">증거 카드 보기</button><button class="action primary" id="retry">다시 분석하기</button>'; document.getElementById('review').addEventListener('click',()=>window.location.href='../episode-14-investigation-menu/index.html'); document.getElementById('retry').addEventListener('click',()=>window.location.href='../episode-14-investigation-menu/index.html'); playStamp(false); }
</script></body></html>
