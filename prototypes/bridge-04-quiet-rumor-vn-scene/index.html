    <section class="end-panel" id="endPanel"><div class="end-card"><div class="end-kicker">BRIDGE 04</div><div class="end-title">소문은 방향만 남겼다.</div><div class="end-copy">이유나는 내부 정보를 넘지 않고, 공개 자료와 업계 소문 사이의 반복만 조심스럽게 전한다. 다음은 허가받은 실제 PC 분석이다.</div><div class="end-actions"><button class="end-button" id="replayButton" type="button">다시 보기</button><button class="end-button primary" id="nextButton" type="button">마무리</button></div></div></section>

  <script>
    window.HLTAudio.init({ sfx:{ click:'../../assets/audio/mobile/common/sfx-click.mp3', card:'../../assets/audio/mobile/common/sfx-card.mp3' } });
    const beats=[
      { type:'narration', speaker:' ', text:'회사 방문이 끝난 지 며칠 뒤, 해인 선배에게서 짧은 메시지가 왔다.', chars:{} },
      { type:'dialogue', speaker:'서해인', text:'지호야, 유나 선배가 잠깐 이야기하고 싶대. 공식 의뢰는 아니고, 그냥 조심스럽게 확인하고 싶은 게 있대.', chars:{haein:['left',1]} },
      { type:'dialogue', speaker:'강지호', text:'회사 내부 이야기인가요?', chars:{haein:['left',1]} },
      { type:'dialogue', speaker:'서해인', text:'그건 아니야. 그래서 더 조심스럽게 만나자는 거고.', chars:{haein:['left',2]} },
      { type:'dialogue', speaker:'한민서', text:'나도 같이 가도 돼? 옆에서 메모만 할게.', chars:{minseo:['right',1],haein:['left',1]} },
      { type:'dialogue', speaker:'서해인', text:'괜찮아. 대신 오늘 들은 건 공개 자료 범위 안에서만 정리해야 해.', chars:{minseo:['right',0],haein:['left',1]}, info:{title:'대화 범위', lines:['공식 의뢰 아님','회사 내부 정보 제외','공개 자료와 업계 소문만']} },
      { type:'narration', speaker:' ', text:'회사 근처 카페 구석 자리에서 이유나는 먼저 노트를 덮어 두고 기다리고 있었다.', chars:{} },
      { type:'dialogue', speaker:'이유나', text:'와 줘서 고마워요. 먼저 선을 분명히 할게요. 회사 내부 사건을 말하려는 건 아닙니다.', chars:{yuna:['right',1],haein:['left',1]} },
      { type:'dialogue', speaker:'강지호', text:'네. 공개 범위에서만 듣겠습니다.', chars:{yuna:['right',1],haein:['left',1]} },
      { type:'dialogue', speaker:'이유나', text:'좋아요. 고객 정보, 시스템 정보, 내부 로그는 공유할 수 없어요. 그건 앞으로도 마찬가지예요.', chars:{yuna:['right',2],haein:['left',1]} },
      { type:'dialogue', speaker:'한민서', text:'그러면 오늘 이야기는 증거가 아니라 참고 방향에 가까운 건가요?', chars:{minseo:['right',1],yuna:['left',1]} },
      { type:'dialogue', speaker:'이유나', text:'정확해요. 업계에서 들리는 말과 공개 자료 사이에 묘한 반복이 있다는 정도입니다.', chars:{minseo:['right',1],yuna:['left',1]} },
      { type:'dialogue', speaker:'서해인', text:'그 표현이면 괜찮네요. 반복이 있다. 하지만 같은 사건이라고 말하진 않는다.', chars:{haein:['left',1],yuna:['right',1]} },
      { type:'dialogue', speaker:'이유나', text:'최근 몇몇 곳에서 브라우저 시작 페이지가 바뀌었다는 문의가 있었다는 말이 돌아요.', chars:{yuna:['right',1],haein:['left',1]}, info:{title:'업계 소문', lines:['브라우저 시작 페이지 변경','공식 보고서 아님','동일 사건 단정 불가']} },
      { type:'dialogue', speaker:'강지호', text:'그 자체로는 약하네요. 사용자 진술이고, 출처도 직접 확인된 건 아니니까요.', chars:{yuna:['right',1],haein:['left',4]} },
      { type:'dialogue', speaker:'이유나', text:'맞아요. 그런데 로그인 직후 짧은 콘솔 창을 봤다는 말도 같이 나옵니다.', chars:{yuna:['right',2],haein:['left',1]} },
      { type:'dialogue', speaker:'한민서', text:'해인 선배 PC에서 봤던 흐름이랑 비슷해 보여.', chars:{minseo:['right',2],haein:['left',1]} },
      { type:'dialogue', speaker:'강지호', text:'비슷하지만 아직 증거는 아니야. 같은 종류의 증상이 반복된다는 참고 맥락 정도.', chars:{minseo:['right',1],haein:['left',1]} },
      { type:'dialogue', speaker:'이유나', text:'그리고 클라우드 노트나 문서 동기화 도구 이름이 반복된다는 말도 있어요.', chars:{yuna:['right',1],minseo:['left',1]}, info:{title:'반복 단어', lines:['클라우드 노트 계열','문서 동기화 도구','증상 단어 반복']} },
      { type:'dialogue', speaker:'서해인', text:'여기서 중요한 건 이름이 아니라 반복되는 증상과 맥락이야.', chars:{haein:['left',1],yuna:['right',1]} },
      { type:'dialogue', speaker:'강지호', text:'EP9에서 정리한 공개 자료랑 방향은 맞지만, 강한 근거로 올리면 안 되겠네요.', chars:{haein:['left',1],yuna:['right',1]} },
      { type:'dialogue', speaker:'이유나', text:'그래서 지호 씨에게 묻고 싶었어요. 이런 이야기를 들으면 다음에 뭘 봐야 한다고 생각해요?', chars:{yuna:['right',0],haein:['left',1]} },
      { type:'dialogue', speaker:'강지호', text:'허가받은 PC에서 로컬 기록을 봐야 합니다. 시작 페이지 변경, 로그인 직후 실행, Helper 계열 흔적, 외부 전송 여부.', chars:{yuna:['right',0],haein:['left',4]}, info:{title:'다음 확인점', lines:['브라우저 설정 변경','로그인 직후 실행','Helper 계열 흔적','외부 전송 여부']} },
      { type:'dialogue', speaker:'한민서', text:'소문으로 결론을 내리는 게 아니라, 실제 기록을 볼 방향을 정하는 거네.', chars:{minseo:['right',0],haein:['left',4]} },
      { type:'dialogue', speaker:'서해인', text:'좋아. 그 표현이면 안전해. 방향은 잡되, 결론은 보류한다.', chars:{haein:['left',4],minseo:['right',0]} },
      { type:'dialogue', speaker:'이유나', text:'그 정도 선을 지킬 수 있다면... 나중에 개인적으로 봐줬으면 하는 PC가 하나 있어요.', chars:{yuna:['right',2],haein:['left',1]} },
      { type:'dialogue', speaker:'강지호', text:'유나 선배 PC인가요?', chars:{yuna:['right',2],haein:['left',1]} },
      { type:'dialogue', speaker:'이유나', text:'네. 회사 장비는 아니고 개인 PC입니다. 그래도 허락 범위를 정확히 정한 뒤에요.', chars:{yuna:['right',1],haein:['left',1]} },
      { type:'dialogue', speaker:'서해인', text:'그럼 다음엔 정식으로 범위를 정하자. 어디까지 봐도 되는지, 무엇을 열면 안 되는지.', chars:{haein:['left',1],yuna:['right',1]} },
      { type:'dialogue', speaker:'강지호', text:'알겠습니다. 오늘 이야기는 증거가 아니라 다음 분석 방향으로만 정리하겠습니다.', chars:{haein:['left',1],yuna:['right',0]} },
      { type:'narration', speaker:' ', text:'카페를 나서며 지호는 소문이 아니라 허가받은 기록만이 다음 문을 열 수 있다는 것을 다시 확인했다.', chars:{}, end:true }
    ];
    const ids=['haein','junwoo','taeyoon','minseo','yuna'];
    const els=Object.fromEntries(ids.map(id=>[id,document.getElementById(id)]));
    const focusDim=document.getElementById('focusDim'), speaker=document.getElementById('speaker'), line=document.getElementById('line'), counter=document.getElementById('counter'), dialogueBox=document.getElementById('dialogueBox'), autoBtn=document.getElementById('autoBtn'), hintBtn=document.getElementById('hintBtn'), skipBtn=document.getElementById('skipBtn'), infoCard=document.getElementById('infoCard'), infoTitle=document.getElementById('infoTitle'), infoLines=document.getElementById('infoLines'), endPanel=document.getElementById('endPanel');
    let index=0, auto=false, hintOn=false, currentInfo=null, autoTimer=null, typeTimer=null, isTyping=false, currentText='';
    function stopTyping(){ if(typeTimer) clearInterval(typeTimer); typeTimer=null; isTyping=false; }
    function completeText(){ stopTyping(); line.textContent=currentText; }
    function typeText(text){ stopTyping(); currentText=text; line.textContent=''; let i=0; isTyping=true; typeTimer=setInterval(()=>{ line.textContent += text[i] || ''; i += 1; if(i > text.length) stopTyping(); }, 18); }
    function offClass(id){ return id==='haein'||id==='junwoo'?'off-left':'off-right'; }
    function applyCharacters(chars){ let shown=false; ids.forEach(id=>{ const el=els[id]; el.className='char '+id+' '+offClass(id); if(chars[id]){ const [slot,expr]=chars[id]; el.className='char '+id+' '+slot+' show expr-'+expr; shown=true; } }); focusDim.classList.toggle('on', shown); }
    function renderHint(){ infoLines.innerHTML=''; if(!hintOn || !currentInfo){ infoCard.classList.remove('show'); return; } infoTitle.textContent=currentInfo.title; currentInfo.lines.forEach(text=>{ const node=document.createElement('div'); node.className='info-line'; node.textContent=text; infoLines.appendChild(node); }); infoCard.classList.add('show'); }
    function applyInfo(info){ currentInfo=info || null; renderHint(); }
    function finish(){ endPanel.classList.add('show'); }
    function showBeat(){ const beat=beats[index]; if(!beat) return; clearTimeout(autoTimer); stopTyping(); applyCharacters(beat.chars || {}); applyInfo(beat.info); speaker.textContent=beat.speaker || ' '; counter.textContent=`${index+1} / ${beats.length}`; line.classList.toggle('muted', beat.type==='narration'); typeText(beat.text); if(beat.end) autoTimer=setTimeout(finish,1300); if(auto && !beat.end) autoTimer=setTimeout(next, Math.max(1500, beat.text.length * 85)); }
    function next(){ if(isTyping){ completeText(); return; } if(index < beats.length - 1){ index += 1; showBeat(); return; } finish(); }
    dialogueBox.addEventListener('click', next);
    document.getElementById('phone').addEventListener('click', e=>{ if(e.target.closest('button') || e.target.closest('.dialogue-box')) return; next(); });
    autoBtn.addEventListener('click',()=>{ auto=!auto; autoBtn.textContent=auto?'AUTO ON':'AUTO'; autoBtn.classList.toggle('on', auto); if(auto) showBeat(); else clearTimeout(autoTimer); });
    hintBtn.addEventListener('click',()=>{ hintOn=!hintOn; hintBtn.textContent=hintOn?'HINT ON':'HINT'; hintBtn.classList.toggle('on', hintOn); renderHint(); });
    skipBtn.addEventListener('click',()=>{ stopTyping(); index=beats.length-1; showBeat(); completeText(); });
    document.getElementById('replayButton').addEventListener('click',()=>location.reload());
    document.getElementById('nextButton').addEventListener('click',()=>window.location.href='../bridge-04-quiet-rumor-ending-comic-animation/index.html');
    showBeat();
  </script>
</body>
</html>
